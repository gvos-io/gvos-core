# G-VOS Kamailio minimal routing script (spike stage).
#
# Flow (matches docs/02-architecture.md §3.1):
#   INVITE -> auth check -> rating lock via gv-core HTTP -> route
#   dispatch to gateway -> on answer RTPengine engaged -> BYE -> CDR
#   event to gv-core.
#
# The HTTP calls go to gv-core:8080 (docker network) via the http_client
# module. This is the simplest correct integration; the production
# version moves to an in-process dispatcher with cached snapshots.

#!KAMAILIO
debug=2
log_stderror=yes

alias="gvos.local"

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

# --- modules
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "htable.so"
loadmodule "http_client.so"
loadmodule "json.so"
loadmodule "rtpengine.so"
loadmodule "nathelper.so"
loadmodule "corex.so"

# --- core params
fork=yes
children=4

# --- rtpengine
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")

# --- http_client (gv-core event API)
modparam("http_client", "httpcon", "gvcore=>http://gv-core:8080")

# --- htable: per-account live-call counters (guard max_concurrent)
modparam("htable", "htable", "livecalls=>size=10;autoexpire=0;")

####### Routing logic ########

request_route {
    route(REQ_SANITY);

    if (is_method("REGISTER")) {
        # Spike: accept registrations without auth; production adds
        # auth_db against gv-core's account store.
        save("location");
        exit;
    }

    if (is_method("INVITE")) {
        route(BILL_LOCK);
        route(RTP_RELAY);
        route(GW_DISPATCH);
    } else if (is_method("BYE|CANCEL")) {
        route(CDR_EVENT);
        route(RTP_RELAY);
    } else {
        route(RTP_RELAY);
    }

    # Forward statefully via default route set by GW_DISPATCH.
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[REQ_SANITY] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        xlog("L_WARN", "sanity failed from $si\n");
        exit;
    }
}

# Ask gv-core for a rating lock on this call: account + destination.
# 403 is returned when the balance cannot cover the estimate —
# that is the "real-time billing, forced release" guarantee.
route[BILL_LOCK] {
    $var(body) = '{"call_id": "' + $ci + '", "from_user": "' + $fU + '", "to_user": "' + $rU + '"}';
    if ($http_req(gvcore, "/v1/call/start", "POST", $var(body)) == 200) {
        xlog("L_INFO", "bill-lock ok for $ci\n");
    } else {
        xlog("L_WARN", "bill-lock REJECTED for $ci\n");
        sl_send_reply("403", "Insufficient Balance");
        exit;
    }
}

route[CDR_EVENT] {
    $var(body) = '{"call_id": "' + $ci + '", "event": "end"}';
    if ($http_req(gvcore, "/v1/call/end", "POST", $var(body)) != 200) {
        xlog("L_ERR", "cdr event failed for $ci\n");
    }
}

# Media: engage rtpengine so media flows through it (needed later for
# recording fork and QoS stats; pure passthrough for now).
route[RTP_RELAY] {
    if (is_method("INVITE|BYE|CANCEL|ACK")) {
        rtpengine_manage("replace-origin replace-session-connection");
    }
}

# Spike dispatch: round-robin over the gateway list from the dispatcher
# table would live here. For the spike one static gateway is set as
# default route target via $du in the compose env (see deploy/.env).
route[GW_DISPATCH] {
    # $du comes from a database in production; the spike seeds it via
    # the dispatch below to the demo gateway container.
    $du = "sip:demo-gw:5060";
    xlog("L_INFO", "dispatching $ci to $du\n");
}

# Answer/200 handling: notify gv-core that the call connected so
# interim charging starts. $http_req sync call keeps the spike simple;
# production moves this off the reply path into the event router.
onreply_route {
    if (t_check_status("200")) {
        $var(body) = '{"call_id": "' + $ci + '", "event": "answer"}';
        if ($http_req(gvcore, "/v1/call/answer", "POST", $var(body)) != 200) {
            xlog("L_ERR", "answer event failed for $ci\n");
        }
    }
}
