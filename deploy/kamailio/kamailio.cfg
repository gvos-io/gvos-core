# G-VOS Kamailio minimal routing script (spike stage).
#
# Flow (matches docs/02-architecture.md §3.1):
#   INVITE -> auth check -> rating lock via gv-core HTTP -> route
#   dispatch to gateway -> on answer RTPengine engaged -> BYE -> CDR
#   event to gv-core.
#
# The HTTP calls go to gv-core:8080 (docker network) via the http_client
# module. This is the simplest correct integration; the production
# version moves to an in-process dispatcher with cached snapshots.

#!KAMAILIO
debug=2
log_stderror=yes

alias="gvos.local"

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
# WebSocket entry for browser/WebRTC endpoints (AI media plane path).
listen=tls:0.0.0.0:4444

# TLS engine flag must parse BEFORE modules load (tls.so reads it at
# registration time).
enable_tls=1
tcp_accept_no_cl=yes


# --- modules
mpath="/usr/lib/kamailio/modules/"
loadmodule "tls.so"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "htable.so"
loadmodule "http_client.so"
loadmodule "json.so"
loadmodule "corex.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "dispatcher.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "rtpengine.so"

# --- TLS for the WebSocket listener.
modparam("tls", "certificate", "/etc/kamailio/tls/kamailio-cert.pem")
modparam("tls", "private_key", "/etc/kamailio/tls/kamailio-key.pem")
modparam("tls", "tls_method", "TLSv1.2")
loadmodule "nathelper.so"
loadmodule "jansson.so"

# --- core params
fork=yes
children=4

# --- http_client (gv-core event API)
modparam("http_client", "httpcon", "gvcore=>http://gv-core:8080")
# Self-signed cert: do not verify the gv-core TLS chain (docker network).

# --- auth: Digest against the PostgreSQL accounts table.
modparam("auth_db", "db_url", "postgres://gvos:gvos_dev@postgres:5432/gvos")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "password_column", "ha1")
#!subst "/REALM/gvos.local/"

# --- htable: per-account live-call counters (guard max_concurrent)
modparam("htable", "htable", "livecalls=>size=10;autoexpire=0;")

# --- htable: call metadata. Key = call-id.
#   meta:st:<ci>  INVITE receive time (ms) for PDD
#   meta:an:<ci>  200 OK time (ms) for duration
modparam("htable", "htable", "meta=>size=10;autoexpire=600;")

# --- registrar: memory-only location (no db_mode; registrations are
# hot state, they do not survive restarts by design).
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_expires", 3600)

# --- rtpengine: media plane. Media flows through rtpengine so the
# recording fork and QoS stats have a place to hook.
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")

# --- dispatcher: gateway routing from the PG gateways table.
# Set 1 = outbound carriers. mode 8 picks by priority (attrs), probes
# failed gateways and marks them inactive (auto lock).
modparam("dispatcher", "db_url", "postgres://gvos:gvos_dev@postgres:5432/gvos")
modparam("dispatcher", "table_name", "gateways")
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_from", "sip:probe@gvos.local")

####### Routing logic ########

request_route {
    route(REQ_SANITY);

    if (has_totag()) {
        # In-dialog requests (ACK, BYE, re-INVITE): route along the
        # record-route path.
        xlog("L_INFO", "in-dialog $rm for $ci\n");
        rtpengine_manage("replace-origin replace-session-connection");
        if (loose_route()) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        # No Route header (UAC sent ACK straight to the Contact): the
        # 2xx Contact points at the gateway - relay there directly.
        if (is_method("ACK|BYE")) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            $du = "sip:demo-gw:5060";
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        sl_send_reply("400", "Bad Routing");
        exit;
    }

    if (is_method("REGISTER")) {
        # Registration with the same Digest auth as INVITE: challenge
        # then verify against accounts, then save the location.
        if (!www_authorize("REALM", "accounts")) {
            www_challenge("REALM", "0");
            exit;
        }
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    # SIP-over-WS messages from upgraded connections arrive as normal
    # requests on this path once the xhttp upgrade below completed.

    if (is_method("INVITE")) {
        # SIP Digest auth: 401 challenge, then verify against accounts.
        if (!www_authorize("REALM", "accounts")) {
            www_challenge("REALM", "0");
            exit;
        }
        record_route();  # stay in the path so ACK/BYE traverse us
        # Engage rtpengine: SDP c=/m= lines rewritten to point media
        # at the relay (recording fork + QoS stats hook here later).
        rtpengine_manage("replace-origin replace-session-connection");
        # Mark INVITE arrival for PDD measurement ($TV: µs-precision
        # clock; $TS is second-granular and rounds local PDD to 0).
        $sht(meta=>st:$ci) = $TV(s);
        $sht(meta=>stus:$ci) = $TV(u);
        route(BILL_LOCK);
        route(GW_DISPATCH);
        t_on_failure("GW_FAILOVER");
    }

    # Forward statefully via the route set by GW_DISPATCH.
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[REQ_SANITY] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        xlog("L_WARN", "sanity failed from $si\n");
        exit;
    }
}

# Ask gv-core for a rating lock on this call: account + destination.
# 403 is returned when the balance cannot cover the estimate —
# that is the "real-time billing, forced release" guarantee.
# The 200 answer carries {"record":true|false}: when true we engage
# rtpengine call recording (pcap+metadata in the recording volume).
route[BILL_LOCK] {
    $var(body) = '{"call_id": "' + $ci + '", "from_user": "' + $fU + '", "to_user": "' + $rU + '"}';
    $var(rc) = http_connect("gvcore", "/v1/call/start", "application/json", $var(body), "$var(gvr)");
    if ($var(rc) == 200) {
        xlog("L_INFO", "bill-lock ok for $ci\n");
        if ($var(gvr) =~ "\"record\":true") {
            # Recording requested for this call.
            if (start_recording()) {
                xlog("L_INFO", "recording ON for $ci\n");
            } else {
                xlog("L_WARN", "recording FAILED to engage for $ci\n");
            }
        }
    } else {
        xlog("L_WARN", "bill-lock REJECTED for $ci rc=$var(rc)\n");
        sl_send_reply("403", "Insufficient Balance");
        exit;
    }
}

route[CDR_EVENT] {
    # Compose the end event with measured metadata:
    #   duration = BYE time - answer time (both htable-marked)
    #   pdd_ms   = first 200 - INVITE arrival
    #   sip_code = 200 on the normal BYE path
    $var(dur) = 0;
    if ($sht(meta=>an:$ci) > 0) {
        $var(dur) = $TS - $sht(meta=>an:$ci);
    }
    $var(pdd) = 0;
    if ($sht(meta=>st:$ci) > 0 && $sht(meta=>an:$ci) > 0) {
        # Microsecond-precision PDD: (an - st) whole seconds plus the
        # usec delta, rounded to milliseconds.
        $var(secs) = $sht(meta=>an:$ci) - $sht(meta=>st:$ci);
        $var(usdiff) = $sht(meta=>anus:$ci) - $sht(meta=>stus:$ci);
        $var(pdd) = $var(secs) * 1000 + ($var(usdiff) / 1000);
    }
    $var(body) = '{"call_id": "' + $ci + '", "event": "end", "duration": ' + $var(dur) + ', "pdd_ms": ' + $var(pdd) + ', "sip_code": 200, "release": "normal"}';
    $var(rc) = http_connect("gvcore", "/v1/call/end", "application/json", $var(body), "$var(gvr)");
    if ($var(rc) != 200) {
        xlog("L_ERR", "cdr event failed for $ci rc=$var(rc)\n");
    }
    $sht(meta=>an:$ci) = $null;
    $sht(meta=>st:$ci) = $null;
    $sht(meta=>anus:$ci) = $null;
    $sht(meta=>stus:$ci) = $null;
}

# Spike dispatch: static demo gateway target. Production replaces this
# with dispatcher set lookups from PostgreSQL.
route[GW_DISPATCH] {
    $du = "sip:demo-gw:5060";
    xlog("L_INFO", "dispatching $ci to $du\n");
}

# Answer/200 handling: notify gv-core that the call connected. Uses
# $rs (reply status) and @CSeq.method for the method on replies (the
# $rm PV on the reply path reflects the reply's transaction method,
# which is what we want). Records answer time for the duration
# measurement.
onreply_route {
    if ($rs == "200" && $rm == "INVITE") {
        $sht(meta=>an:$ci) = $TV(s);
        $sht(meta=>anus:$ci) = $TV(u);
        $var(body) = '{"call_id": "' + $ci + '", "event": "answer"}';
        $var(rc) = http_connect("gvcore", "/v1/call/answer", "application/json", $var(body), "$var(gvr)");
        if ($var(rc) != 200) {
            xlog("L_ERR", "answer event failed for $ci rc=$var(rc)\n");
        }
    }
}

# WebSocket upgrade: browsers hit the TLS listener with an HTTP GET
# upgrade request; xhttp routes it here and websocket answers.
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET") {
        if (!ws_handle_handshake()) {
            xhttp_reply("500", "Internal Server Error", "", "");
        }
        return;
    }
    xhttp_reply("404", "Not Found", "", "");
}
