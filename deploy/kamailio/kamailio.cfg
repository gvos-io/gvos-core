# G-VOS Kamailio minimal routing script (spike stage).
#
# Flow (matches docs/02-architecture.md §3.1):
#   INVITE -> auth check -> rating lock via gv-core HTTP -> route
#   dispatch to gateway -> on answer RTPengine engaged -> BYE -> CDR
#   event to gv-core.
#
# The HTTP calls go to gv-core:8080 (docker network) via the http_client
# module. This is the simplest correct integration; the production
# version moves to an in-process dispatcher with cached snapshots.

#!KAMAILIO
debug=2
log_stderror=yes

alias="gvos.local"

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

# --- modules
mpath="/usr/lib/kamailio/modules/"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "htable.so"
loadmodule "http_client.so"
loadmodule "json.so"
loadmodule "corex.so"

# --- core params
fork=yes
children=4

# --- http_client (gv-core event API)
modparam("http_client", "httpcon", "gvcore=>http://gv-core:8080")

# --- htable: per-account live-call counters (guard max_concurrent)
modparam("htable", "htable", "livecalls=>size=10;autoexpire=0;")

####### Routing logic ########

request_route {
    route(REQ_SANITY);

    if (has_totag()) {
        # In-dialog requests (ACK, BYE, re-INVITE): route along the
        # record-route path.
        xlog("L_INFO", "in-dialog $rm for $ci\n");
        if (loose_route()) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        # No Route header (UAC sent ACK straight to the Contact): the
        # 2xx Contact points at the gateway - relay there directly.
        if (is_method("ACK|BYE")) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            $du = "sip:demo-gw:5060";
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        sl_send_reply("400", "Bad Routing");
        exit;
    }

    if (is_method("INVITE")) {
        record_route();  # stay in the path so ACK/BYE traverse us
        route(BILL_LOCK);
        route(GW_DISPATCH);
    }

    # Forward statefully via the route set by GW_DISPATCH.
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[REQ_SANITY] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        xlog("L_WARN", "sanity failed from $si\n");
        exit;
    }
}

# Ask gv-core for a rating lock on this call: account + destination.
# 403 is returned when the balance cannot cover the estimate —
# that is the "real-time billing, forced release" guarantee.
route[BILL_LOCK] {
    $var(body) = '{"call_id": "' + $ci + '", "from_user": "' + $fU + '", "to_user": "' + $rU + '"}';
    $var(rc) = http_connect("gvcore", "/v1/call/start", "application/json", $var(body), "$var(gvr)");
    if ($var(rc) == 200) {
        xlog("L_INFO", "bill-lock ok for $ci\n");
    } else {
        xlog("L_WARN", "bill-lock REJECTED for $ci rc=$var(rc)\n");
        sl_send_reply("403", "Insufficient Balance");
        exit;
    }
}

route[CDR_EVENT] {
    $var(body) = '{"call_id": "' + $ci + '", "event": "end"}';
    $var(rc) = http_connect("gvcore", "/v1/call/end", "application/json", $var(body), "$var(gvr)");
    if ($var(rc) != 200) {
        xlog("L_ERR", "cdr event failed for $ci rc=$var(rc)\n");
    }
}

# Spike dispatch: static demo gateway target. Production replaces this
# with dispatcher set lookups from PostgreSQL.
route[GW_DISPATCH] {
    $du = "sip:demo-gw:5060";
    xlog("L_INFO", "dispatching $ci to $du\n");
}

# Answer/200 handling: notify gv-core that the call connected. Uses
# $rs (reply status) instead of t_check_status to avoid tm state
# issues on retransmitted replies.
onreply_route {
    if ($rs == "200" && $rm == "INVITE") {
        $var(body) = '{"call_id": "' + $ci + '", "event": "answer"}';
        $var(rc) = http_connect("gvcore", "/v1/call/answer", "application/json", $var(body), "$var(gvr)");
        if ($var(rc) != 200) {
            xlog("L_ERR", "answer event failed for $ci rc=$var(rc)\n");
        }
    }
}
