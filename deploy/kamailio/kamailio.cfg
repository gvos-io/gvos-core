# gvos Kamailio routing script.
#
# Flow (matches docs/02-architecture.md §3.1):
#   INVITE -> auth check -> rating lock via gv-core HTTP -> route
#   dispatch to gateway -> on answer RTPengine engaged -> BYE -> CDR
#   event to gv-core.
#
# NATS plane (2026-11): the edge subscribes to gvos.cfg.reload
# (gateway/ip_allowlist/blocklist snapshots), gvos.risk.alert (SIP-edge
# ban htable) and gvos.call.teardown (dlg termination); it publishes
# gvos.reg.event (usrloc hooks) and gvos.cdr.raw (BYE events, when
# GVOS_CDR_TRANSPORT=nats). /v1/call/start stays HTTP: it is a
# synchronous decision point and the nats module publishes
# asynchronously only.
#
# Queue groups: every node uses its own (GVOS_NODE_HOST-derived) queue
# group. Core NATS delivers one copy per DISTINCT queue group, so
# unique-per-node groups = every node gets a copy (a shared group
# would load-balance and each node would see only a slice). The nats
# module requires a non-empty group after the colon — an empty group
# string walks off the string end in the module parser and fails
# validation in libnats anyway.

#!KAMAILIO
debug=2
log_stderror=yes

alias="gvos.local"

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
# WebSocket entry for browser/WebRTC endpoints (AI media plane path).
listen=tls:0.0.0.0:4444

# TLS engine flag must parse BEFORE modules load (tls.so reads it at
# registration time).
enable_tls=1
tcp_accept_no_cl=yes

# --- NATS / transport env. GVOS_NODE_HOST must be unique per
# signaling node (compose sets kamailio-1/2; k8s uses the pod name):
# it builds the per-node broadcast queue group.
#!defenv GVOS_NODE_HOST
# WITH_NATS is env-driven: set WITH_NATS=1 on deployments whose image
# ships the nats module (Debian kamailio-nats-modules). The Alpine CI
# image does not include it - leave unset there, the HTTP paths stay.
#!trydefenv WITH_NATS
# Media isolation switch (bench only): GVOS_MEDIA_OFF=1 skips the
# INVITE-path rtpengine_manage so capacity runs measure the control
# plane alone (the ng round-trip and port churn dominate the
# measurement on a dev host).
#!trydefenv GVOS_MEDIA_OFF
# CDR transport: WITH_NATS_CDR=1 switches route[CDR_EVENT] from the
# /v1/call/end HTTP call to nats_publish("gvos.cdr.raw").
#!trydefenv WITH_NATS_CDR
# Bill-lock transport: WITH_NATS_RPC=1 switches route[BILL_LOCK] from
# the blocking /v1/call/start http_connect to the async NATS RPC
# (suspend/continue). NOTE: with this on, the bus becomes
# call-setup-critical — the 2s janitor bounds the failure mode.
#!trydefenv WITH_NATS_RPC
# Allowlist cold-start grace (seconds): while no snapshot has ever
# been applied, route[IPALLOW_CHECK] fails open for this long after
# process boot (3 poller cycles at the default 90), then fails closed.
# Bounds the old unbounded fail-open: an edge whose sync never lands
# (bad token, unreachable gv-core) rejects with L_ERR breadcrumbs
# instead of staying a silent open door.
#!trydefenv GVOS_IPALLOW_BOOT_GRACE
#!trydef GVOS_IPALLOW_BOOT_GRACE 90

# Gateway lockout threshold: consecutive INVITE failures (GW_FAILOVER)
# before the 5-minute gwfail lockout fires. 1 (the old behavior) lets
# a single tail-loss 408 under a burst take the only gateway offline
# and 503 the whole fleet; 3 tolerates burst tails while still locking
# fast on a genuinely dead gateway (3 x fr_timer 5s = dead within 15s).
#!trydefenv GVOS_GWFAIL_THRESHOLD
#!trydef GVOS_GWFAIL_THRESHOLD 3


# --- modules (mpath: Debian multiarch layout first, upstream layout
# second — works on both the trixie package image and source builds)
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/:/usr/lib/kamailio/modules/"
loadmodule "tls.so"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "htable.so"
loadmodule "http_client.so"
loadmodule "json.so"
loadmodule "corex.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "rtpengine.so"

# --- TLS for the WebSocket listener.
modparam("tls", "certificate", "/etc/kamailio/tls/kamailio-cert.pem")
modparam("tls", "private_key", "/etc/kamailio/tls/kamailio-key.pem")
modparam("tls", "tls_method", "TLSv1.2")
loadmodule "nathelper.so"
loadmodule "jansson.so"
loadmodule "timer.so"
loadmodule "ipops.so"
loadmodule "sqlops.so"
# dialog: per-call state so teardown broadcasts can terminate the
# dialog on the node that holds it.
loadmodule "dialog.so"
# tmx: $T(id_index)/$T(id_label) transaction PVs (bill-lock suspend).
loadmodule "tmx.so"
# nats: event bus edge, when the module exists in this image (Debian
# builds ship kamailio-nats-modules; the Alpine CI image does not).
# WITH_NATS controls the modparams + publish routes below.
#!ifdef WITH_NATS
loadmodule "nats.so"
#!endif

# --- timer: periodic allowlist snapshot poll — the reconciliation
# fallback. Primary sync is the gvos.cfg.reload NATS broadcast
# (route[IPALLOW_APPLY]); where the image has no nats module (Alpine
# CI), this poll is the only sync channel. Fires every 30s.
modparam("timer", "declare_timer", "ipallow_poll=IPALLOW_POLL,30000,slow,enable")
# Bill-lock janitor (WITH_NATS_RPC only): 1s tick recovering suspended
# bill-locks whose reply never came (bus down) — see route[BILLLOCK_JANITOR].
#!ifdef WITH_NATS_RPC
modparam("timer", "declare_timer", "billlock_janitor=BILLLOCK_JANITOR,1000,slow,enable")
#!endif

#!ifdef WITH_NATS
# --- NATS subscriptions: per-node queue group — GVOS_NODE_HOST env
# (defenv above) interpolates directly in the cfg text (!!{...} is
# the defenv form; do NOT route it through #!substdef: the value is
# not re-interpolated there, it would land literally).
# Subjects are the dot-free edge aliases (gv-core dual-publishes the
# canonical dotted originals for core replicas + JetStream; the
# event_route lexer cannot express dots, so the edge listens here).
# 1) gvos-edge-cfg:  gateway / ip_allowlist / blocklist snapshots.
# 2) gvos-edge-risk: ban htable at the SIP edge.
# 3) gvos-edge-tear: dlg termination (holder executes, others no-op
#    on the dlg lookup).
# NATS broker: the cluster dial list is materialized by the
# entrypoint (@NATS_URL@, from GVOS_NATS_URL) — Kamailio has no env
# interpolation in modparams. The libnats client in this module
# accepts a comma-separated server list and fails over between
# members (verified: natsOptions_SetServers is the only server-set
# call in the module binary). Cluster alias "nats" (compose network
# alias on all members) also works single-URL.
modparam("nats", "nats_url", "nats://@NATS_URL@")
# Publish pool: answer/CDR/reg events share this pool; a BYE storm
# (mass teardown) bursts all three at once. 4 workers keeps the edge
# publishes off each other's critical path.
modparam("nats", "num_publish_workers", 4)
modparam("nats", "subject_queue_group", "gvos-edge-cfg:qg-@NODE@")
modparam("nats", "subject_queue_group", "gvos-edge-risk:qg-@NODE@")
modparam("nats", "subject_queue_group", "gvos-edge-tear:qg-@NODE@")
#!ifdef WITH_NATS_RPC
# 4) bill-lock replies: node-unique subject — the reply of the async
#    /v1/call/start RPC lands ONLY on the node that suspended the
#    INVITE (t_continue must run where the transaction lives). The
#    publish call (route[BILL_LOCK] third argument), this subscription
#    and event_route[nats:...] below must agree byte-for-byte.
#    SHARDED x4 (BL_REPLY_SHARDS): the nats module runs ONE consumer
#    process per subject — at 100CPS the single consumer serialized
#    every resume behind a ~100/s pipe, the backlog outgrew the 5s
#    fr timer and 25% of calls died at t_continue ("resuming the
#    processing of transaction failed", measured). Shard = tlabel % 4
#    at publish time; each shard is its own consumer child => 4-way
#    parallel resume. The queue groups keep a shard's messages on
#    this node only.
modparam("nats", "subject_queue_group", "gvos-edge-reply-@NODE@:qg-@NODE@-s0")
modparam("nats", "subject_queue_group", "gvos-edge-reply-@NODE@-s1:qg-@NODE@-s1")
modparam("nats", "subject_queue_group", "gvos-edge-reply-@NODE@-s2:qg-@NODE@-s2")
modparam("nats", "subject_queue_group", "gvos-edge-reply-@NODE@-s3:qg-@NODE@-s3")
#!define BL_REPLY_SHARDS 4
#!endif
#!endif

# --- core params
fork=yes
# Worker pool sizing (HTTP-tier bill-lock): each INVITE parks a worker
# for the whole /v1/call/start round trip, and the pool serves ALL SIP
# traffic (BYE/ACK of live calls included). 300 CPS x 50ms core
# latency alone eats ~15 worker-seconds per second; 16 keeps headroom
# for the p99 tail and in-dialog traffic at a modest per-child fork
# cost. Revisit upward before enabling tier-A (WITH_NATS_RPC): the
# suspend path frees the worker instead of parking it.
children=32

# UDP socket buffers: measured ceiling — at 260CPS + retrans storms the
# default ~416KB SO_RCVBUF overflowed (InErrors=RcvbufErrors=1542 per
# 25s window in /proc/net/snmp) and the 401 challenges themselves were
# dropped, so the UACs retransmitted harder and the loop deepened.
# (The 6.0.1 Debian build has no udp_rcv_buf core param: the buffer
# comes from net.core.rmem_default and Kamailio's probe doubles it
# within net.core.rmem_max. The deploy runbook sets rmem_default=4MB
# / rmem_max=8MB on the host; Docker Desktop defaults are 212992.)

# --- http_client (gv-core event API)
modparam("http_client", "httpcon", "gvcore=>http://gv-core:8080")
# Internal snapshot poll (IP allowlist) — same connection, bounded.
modparam("http_client", "connection_timeout", 2)
# Self-signed cert: do not verify the gv-core TLS chain (docker network).

# --- sqlops: direct column reads for the auth HA1 cache fill.
modparam("sqlops", "sqlcon", "gvdb=>postgres://gvos:gvos_dev@postgres:5432/gvos")

# --- auth: Digest against the PostgreSQL accounts table.
# DB is the fallback only: the authcache htable below serves HA1s from
# memory, so the steady-state call path performs zero DB queries.
modparam("auth_db", "db_url", "postgres://gvos:gvos_dev@postgres:5432/gvos")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "password_column", "ha1")
#!subst "/REALM/gvos.local/"

# --- htable: per-account live-call counters (guard max_concurrent)
modparam("htable", "htable", "livecalls=>size=10;autoexpire=0;")

# --- htable: call metadata. Key = call-id.
#   meta:st:<ci>   INVITE receive time (ms) for PDD
#   meta:an:<ci>   200 OK time (ms) for duration
#   meta:gw:<ci>   chosen gateway id (failover skip + ACK/BYE relay
#                  without a Route header)
modparam("htable", "htable", "meta=>size=10;autoexpire=600;")

# --- htable: IP allowlist mirror (source-IP admission control).
#   ipallow:allowlist / ipallow:denylist  comma-joined CIDR lists
#   ipallow:ver      snapshot version ("nats" once a broadcast lands)
#   Primary sync: gvos.cfg.reload (route[IPALLOW_APPLY]); the 30s
#   poll (route[IPALLOW_POLL]) reconciles drift.
modparam("htable", "htable", "ipallow=>size=10;autoexpire=0;")

# --- htable: Digest HA1 cache (auth_db fallback fill).
#   auth:ha1:<username> -> HA1 value. Long TTL; NATS account.changed
#   broadcasts invalidate stale entries via the snapshot side-channel.
modparam("htable", "htable", "authcache=>size=10;autoexpire=86400;")

# --- htable: outbound gateway directory (NATS-mirrored).
#   gw:dest:<id>  "sip:<host:port>"
#   gw:prio:<id>  selection priority (lower = preferred)
#   gw:en:<id>    "1" when enabled (absent = disabled)
#   Applied by route[GW_SYNC] from the gvos.cfg.reload broadcast;
#   empty table = nothing routable (503).
modparam("htable", "htable", "gw=>size=10;autoexpire=0;")

# --- htable: risk bans + per-gateway failure cooldown.
#   banned:acc:<username>  risk.alert hit -> 403 at the edge (1h TTL)
#   gwfail:<id>            failure_route lockout, 5min auto-retry
#   (value keys carry a "v:" prefix to keep sht_iterator probes
#   distinct from the en:/prio: siblings)
modparam("htable", "htable", "banned=>size=10;autoexpire=3600;")
modparam("htable", "htable", "gwfail=>size=10;autoexpire=300;")

# --- htable: destination black-list mirror (prefix screening).
#   bl:bl:dest:<pattern>  black dest prefixes
#   bl:count              active prefix count (fast bail-out)
#   Applied by route[BL_APPLY]; white/regex semantics stay in gv-core
#   (defense in depth: the edge screens prefixes only).
modparam("htable", "htable", "bl=>size=10;autoexpire=0;")

# --- htable: bill-lock suspend bookkeeping (WITH_NATS_RPC only).
#   billlock:<ti>:<tl>:<ts>    pending suspend (janitor scans these)
#   billlock:ci:<ti>:<tl>      call-id parked for the resume route
#   billlock:ans:<ti>:<tl>     parked gv-core answer envelope
#   autoexpire 60s = backstop: entries are removed on resume/timeout;
#   expiry only collects orphans from a crashed worker.
#!ifdef WITH_NATS_RPC
modparam("htable", "htable", "billlock=>size=10;autoexpire=60;")
#!endif

# --- registrar: memory-only location (no db_mode; registrations are
# hot state, they do not survive restarts by design). gvos.reg.event
# publishes give the control plane network-wide visibility.
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_expires", 3600)

# --- rtpengine: media plane. Media flows through rtpengine so the
# recording fork and QoS stats have a place to hook.
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")

# --- dialog: track dialogs for teardown termination.
modparam("dialog", "default_timeout", 21600) # 6h hard cap

####### Routing logic ########

# NOTE on the boot latch: 'startup_route' is NOT a keyword in this
# build (Kamailio 6.0.1 trixie deb — the grammar has no such token;
# the parse dies at the route declaration). The cold-boot latch is
# owned by the fallback in route[IPALLOW_CHECK] instead: it stamps
# $sht(ipallow=>boot) at the first admitted request when the slot is
# empty. Slightly later than true process start, but inside the same
# 90s grace window (3 poller cycles) either way.

request_route {
    route(REQ_SANITY);

    # Source-IP admission (allowlist mirror in htable, zero DB per
    # request). WS-originated traffic is exempt: it arrives from the
    # local TLS listener and was already admitted by the upgrade.
    if (proto != WS && proto != WSS) {
        route(IPALLOW_CHECK);
    }

    # Transaction-level ACK (e.g. the ACK a caller sends for a
    # 401/407 Digest challenge): belongs to the INVITE transaction,
    # not to any dialog. Absorb it here — letting it fall into the
    # has_totag() branch re-routes a challenge ACK to the gateway
    # (meta:gw keyed by call-id, which a SIPp-style re-used call-id
    # can hit with a stale entry from a previous run), where an agent
    # worker rightly answers 481 Call Does Not Exist. t_check_trans()
    # absorbs it when the challenge reply had a transaction; a
    # stateless challenge leaves none, so also drop ACKs that find no
    # matching dialog. A 2xx-ACK for an established call carries a
    # Route header (loose_route below) or a dialog that dlg_manage
    # tracked — neither path is affected.
    if (is_method("ACK")) {
        if (t_check_trans()) {
            xlog("L_INFO", "absorbed transaction ACK for $ci\n");
            exit;
        }
        # No matching transaction AND no dialog for this call-id: a
        # challenge/reject ACK (stateless 401/403 leaves no dialog;
        # dlg_manage on a passed INVITE creates one only when auth
        # succeeded and dispatch ran).
        if ($dlg(state) == $null) {
            xlog("L_INFO", "dropped ACK without dialog for $ci (challenge/reject ACK)\n");
            exit;
        }
    }

    if (has_totag()) {
        # In-dialog requests (ACK, BYE, re-INVITE): route along the
        # record-route path.
        # Retransmission guard FIRST (40CPS×10 bench: 8609 BYE
        # invocations for 3641 calls — every BYE retrans ran the full
        # route incl. the synchronous rtpengine ng round-trip, and
        # each re-published cdr.raw). t_check_trans() absorbs any
        # request whose transaction already exists (tm re-sends the
        # stored reply — including the BYE 200) and returns without
        # falling through. Only requests that create a NEW transaction
        # (first ACK, first BYE, re-INVITE) reach the media path.
        if (t_check_trans()) {
            xlog("L_INFO", "absorbed in-dialog retransmission $rm for $ci\n");
            exit;
        }
        xlog("L_INFO", "in-dialog $rm for $ci\n");
        # rtpengine ng round-trip only when there is an SDP to rewrite
        # (ACK/BYE carry none: the measured tail called rtpengine 3122
        # times on ACKs that always failed). QoS stats for CDR_EVENT
        # ride the answer-path rtpengine_manage instead.
        # BYE carries no SDP and runs NO rtpengine call: the delete
        # round-trip (F-4 attempt) serialized inside the workers and
        # measured as the round-6/7 BYE->408 tail at 100CPS. Port
        # reclamation is rtpengine's own job: the media-inactivity
        # timeout (--timeout 60) reaps idle sessions, and the
        # widened port pool (deploy/entrypoint.sh: 30000-60000)
        # absorbs the CPS x timeout x 4-ports steady state.
        #!ifndef GVOS_MEDIA_OFF
        if (has_body("application/sdp")) {
            xlog("L_INFO", "RTP-PRE ci=$ci hdr_cl=$hdr(Content-Length)
");
            rtpengine_manage("replace-origin replace-session-connection");
            xlog("L_INFO", "RTP-POST ci=$ci ret=$?
");
        }
        #!endif
        if (loose_route()) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        # No Route header (UAC sent ACK straight to the Contact): the
        # 2xx Contact points at the gateway - relay there directly.
        if (is_method("ACK|BYE")) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            route(GW_CONTACT);
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        sl_send_reply("400", "Bad Routing");
        exit;
    }

    if (is_method("REGISTER")) {
        # Registration with the same Digest auth as INVITE: challenge
        # then verify against accounts (cache-first, DB fallback),
        # then save the location.
        route(AUTH_CACHE);
        if (!save("location")) {
            sl_reply_error();
        }
        # Publish the registration event: gv-core mirrors the
        # network-wide registration state (observability + reg_freq
        # fraud rules) from gvos.reg.event.
        route(REG_EVENT);
        exit;
    }

    # SIP-over-WS messages from upgraded connections arrive as normal
    # requests on this path once the xhttp upgrade below completed.

    if (is_method("INVITE")) {
        # Retransmission absorption FIRST: the authed INVITE's UDP
        # retransmission re-enters this route ~500ms later (t_suspend
        # does not park retransmission matching the way t_relay does;
        # Kamailio 6.0.1 re-injects them). Without this guard the
        # retrans re-runs AUTH_CACHE, the (stateless) stale-nonce
        # check 401s it, and the stray 401 mid-dialog aborts strict
        # UACs (SIPp: "unexpected message" -> Failed call) and can
        # cascade into gateway lockouts. t_check_trans absorbs any
        # request retransmission whose transaction already exists.
        if (t_check_trans()) {
            xlog("L_INFO", "absorbed INVITE retransmission for $ci\n");
            exit;
        }
        # Risk-edge ban first: a gv-core risk.alert hit lands in the
        # banned htable and rejects the next INVITE with zero
        # control-plane round trips (1h auto-expire).
        if ($sht(banned=>acc:$fU) != $null) {
            xlog("L_WARN", "BANNED user $fU rejected at edge\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        # Destination prefix screening (bl mirror, zero DB).
        route(BL_CHECK);
        # SIP Digest auth: 401 challenge, then verify (cache-first,
        # DB fallback only on a cache miss). The challenge stays
        # stateless (sl): a t_newtran before it would leave the
        # transaction half-open and tm would retransmit the 401 at
        # T1, which strict UACs read as a fresh challenge and
        # re-send the authed INVITE — a measured regression.
        route(AUTH_CACHE);
        record_route();  # stay in the path so ACK/BYE traverse us
        dlg_manage();    # per-dialog state: teardown broadcasts find it
        # Engage rtpengine: SDP c=/m= lines rewritten to point media
        # at the relay (recording fork + QoS stats hook here later).
        # GVOS_MEDIA_OFF (bench isolation): skip the ng round-trip
        # entirely — the control plane gets measured without the
        # media plane's latency/ports in the path.
        #!ifndef GVOS_MEDIA_OFF
        xlog("L_INFO", "RTP-PRE ci=$ci hdr_cl=$hdr(Content-Length)
");
        rtpengine_manage("replace-origin replace-session-connection");
        xlog("L_INFO", "RTP-POST ci=$ci ret=$?
");
        #!endif
        # Mark INVITE arrival for PDD measurement ($TV: µs-precision
        # clock; $TS is second-granular and rounds local PDD to 0).
        $sht(meta=>st:$ci) = $TV(s);
        $sht(meta=>stus:$ci) = $TV(u);
        $sht(meta=>ftag:$ci) = $ft;
        #!ifdef WITH_NATS_RPC
        # t_suspend requires a transaction, and nothing upstream
        # creates one for a fresh INVITE (record_route/dlg_manage/
        # rtpengine_manage do not; the Digest re-INVITE arrives as a
        # new stateless request after the stateless 401). Without
        # t_newtran, $T(id_index)/$T(id_label) evaluate to 0:0 and
        # the suspend bookkeeping is unusable.
        if (!t_newtran()) {
            sl_send_reply("500", "Server Error");
            exit;
        }
        # Async lock: BILL_LOCK publishes the request, suspends the
        # transaction and exits — the resume route (BILL_LOCK_REPLY)
        # runs GW_DISPATCH/t_relay when the answer arrives.
        route(BILL_LOCK);
        #!else
        route(BILL_LOCK);
        route(GW_DISPATCH);
        t_on_failure("GW_FAILOVER");
        #!endif
    }

    # Forward statefully via the route set by GW_DISPATCH.
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[REQ_SANITY] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        xlog("L_WARN", "sanity failed from $si\n");
        exit;
    }
}

# Source-IP admission: the ipallow htable mirror holds the
# comma-joined CIDR lists. Deny exceptions first (explicit deny beats
# broad allow), then the allow list; no match = default-deny. All in
# memory, zero DB per request. No snapshot loaded yet
# ($sht(ipallow=>ver) empty) = bounded fail-open: the first
# GVOS_IPALLOW_BOOT_GRACE seconds after boot (defaults to 90 = 3 poll
# cycles) admit while the 30s poller / NATS broadcast populate the
# table; after the grace the check fails closed with an L_ERR
# breadcrumb every 60s. An operator who really wants open edge sets
# 0.0.0.0/0,allow — that is auditable, an infinite fail-open is not.
route[IPALLOW_CHECK] {
    # No snapshot loaded yet -> bounded fail-open (see macro above).
    # boot is latched by startup_route at process start; the fallback
    # latch here only fires if a request somehow beat startup_route
    # (normally impossible — it runs before the listeners open).
    if ($sht(ipallow=>ver) == $null) {
        $var(uptime) = 0;
        if ($Ts != $null && $Ts != 0) {
            $var(boot) = $Ts;
            if ($sht(ipallow=>boot) != $null) {
                $var(boot) = $sht(ipallow=>boot);
            } else {
                $sht(ipallow=>boot) = $Ts;
            }
            $var(uptime) = $Ts - $var(boot);
        }
        if ($var(uptime) <= GVOS_IPALLOW_BOOT_GRACE) {
            return;
        }
        # Grace expired, still no snapshot: fail closed. Ratelimit the
        # breadcrumb (once a minute) so a busy edge does not log-flood.
        if ($sht(ipallow=>lasterr) == $null || $Ts - $sht(ipallow=>lasterr) >= 60) {
            $sht(ipallow=>lasterr) = $Ts;
            xlog("L_ERR", "ipallow FAIL-CLOSED $si: no snapshot after GVOS_IPALLOW_BOOT_GRACE s grace (poller sync failing? check GVOS_INTERNAL_TOKEN / GVOS_CORE_HOST / NATS)\n");
        }
        sl_send_reply("403", "Forbidden");
        exit;
    }
    # Deny exceptions first (explicit deny beats broad allow).
    if ($sht(ipallow=>denylist) != $null && $sht(ipallow=>denylist) != "") {
        if (is_in_subnet("$si", "$sht(ipallow=>denylist)")) {
            xlog("L_WARN", "ipallow DENY $si matched deny exception\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
    }
    if ($sht(ipallow=>allowlist) == $null || $sht(ipallow=>allowlist) == "") {
        xlog("L_WARN", "ipallow REJECT $si: empty allow set (default-deny)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    if (!is_in_subnet("$si", "$sht(ipallow=>allowlist)")) {
        xlog("L_WARN", "ipallow REJECT $si: no allow rule matched (default-deny)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
}

# Destination prefix screening: black-list mirror in the bl htable.
# Probe $rU from full length downward (<= 20 hash probes); a hit =
# 403 at the edge with zero control-plane cost. White-list and regex
# semantics stay in gv-core (defense in depth).
route[BL_CHECK] {
    if ($sht(bl=>count) == $null || $sht(bl=>count) == 0) {
        return;
    }
    $var(num) = $rU;
    $var(len) = $(var(num){s.len});
    while ($var(len) > 0) {
        $var(pat) = $(var(num){s.substr,0,$var(len)});
        if ($sht(bl=>bl:dest:$var(pat)) != $null) {
            xlog("L_WARN", "BL block dest $rU matched prefix $var(pat)\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        $var(len) = $var(len) - 1;
    }
}

# Digest auth, cache-first: the authcache htable serves the HA1 so the
# steady-state call path never queries PostgreSQL. DB (auth_db) stays
# as the cache-miss fallback; a successful DB pass fills the cache via
# one sqlops read of the same column www_authorize checked.
route[AUTH_CACHE] {
    if ($sht(authcache=>ha1:$fU) != $null) {
        $avp(ha1cache) = $sht(authcache=>ha1:$fU);
        # Flag bit 1: the second argument is an HA1 digest, NOT a
        # plaintext password. With any other value the module hashes
        # the HA1 as if it were the password (md5(user:realm:HA1) =
        # the double-hash 91cd0364... signature) and every
        # cached-credential auth fails (measured under load; the
        # single-call pass was the DB path, which masked it).
        if (pv_www_authenticate("REALM", "$avp(ha1cache)", "1")) {
            return;
        }
        # Stale or wrong credentials: drop the cache entry so the DB
        # pass below re-verifies AND refills (the old trap: a stale
        # entry would 401-loop forever since the failure path never
        # refreshed it).
        $sht(authcache=>ha1:$fU) = $null;
        www_challenge("REALM", "0");
        exit;
    }
    if (!www_authorize("REALM", "accounts")) {
        www_challenge("REALM", "0");
        exit;
    }
    # Cache fill after a successful DB authentication: one column
    # read via sqlops, then the steady state runs from htable alone.
    $var(q) = "select ha1 from accounts where username='" + $fU + "' and deleted_at is null";
    if (sql_query("gvdb", "$var(q)", "rl")) {
        if ($dbr(rl=>rows) > 0) {
            $sht(authcache=>ha1:$fU) = $dbr(rl=>[0,0]);
            xlog("L_INFO", "authcache: cached HA1 for $fU\n");
        }
        sql_result_free("rl");
    }
}

# Periodic allowlist snapshot poll (30s timer): reconciliation
# fallback for the NATS broadcast (a node that missed broadcasts —
# restart, reconnect window — converges here). Pulls the
# version-stamped snapshot and rebuilds two comma-joined CIDR lists
# (allowlist/denylist) that IPALLOW_CHECK feeds to is_in_subnet — two
# function calls per request, zero iteration.
route[IPALLOW_POLL] {
    $var(url) = "http://" + $env(GVOS_CORE_HOST) + ":8080/v1/internal/ipallow-snapshot";
    $var(hdrs) = "X-GVOS-Internal: " + $env(GVOS_INTERNAL_TOKEN) + "
";
    $var(rc) = http_client_request("GET", "$var(url)", "", "$var(hdrs)", "$var(gvr)");
    if ($var(gvr) == $null) {
        return;
    }
    if ($var(rc) != 200) {
        xlog("L_WARN", "ipallow sync failed rc=$var(rc)
");
        return;
    }
    $var(newver) = "";
    jansson_get("version", $var(gvr), "$var(newver)");
    if ($var(newver) == $sht(ipallow=>ver)) {
        return;
    }
    # gv-core pre-joins the CIDR lists (allow_cidrs/deny_cidrs) —
    # jansson path notation cannot index arrays dynamically, so the
    # finished strings are the contract.
    $var(allows) = "";
    $var(denies) = "";
    jansson_get("allow_cidrs", $var(gvr), "$var(allows)");
    jansson_get("deny_cidrs", $var(gvr), "$var(denies)");
    $sht(ipallow=>allowlist) = $var(allows);
    $sht(ipallow=>denylist) = $var(denies);
    $sht(ipallow=>ver) = $var(newver);
    xlog("L_INFO", "ipallow sync: version=$var(newver) allows=$var(allows) denies=$var(denies)
");
}

# Ask gv-core for a rating lock on this call: account + destination.
# 403 is returned when the balance cannot cover the estimate —
# that is the "real-time billing, forced release" guarantee.
# The 200 answer carries {"record":true|false}: when true we engage
# rtpengine call recording (pcap+metadata in the recording volume).
#
# Two transports (WITH_NATS_RPC):
#   - NATS async RPC: publish the request with a per-node reply
#     subject, suspend the INVITE transaction (the worker is free to
#     take the next call), and resume in BILL_LOCK_REPLY when the
#     answer lands on this node's reply subject. t_suspend/t_continue
#     keep the INVITE context; the resume route runs with
#     failure-route semantics, so gateway selection re-runs there
#     ($du does not survive the suspend). A 1s janitor timer
#     (BILLLOCK_JANITOR) recovers suspends whose reply never came
#     (bus down) with a 503 — the lock path never hangs.
#   - HTTP (default/off): the blocking http_connect call.
route[BILL_LOCK] {
    #!ifdef WITH_NATS_RPC
    # $T(id_index)/$T(id_label) are EMPTY outside an active transaction
    # context (observed: a retransmitted/re-INVITE after the Digest
    # challenge, when tm has already released the first UAS). The
    # resulting '"tindex": , "tlabel": }' is invalid JSON — the
    # responder 400s it and (pre-fix) the edge dropped the reply.
    # Park the coordinates in vars first; when they are empty there is
    # no transaction to suspend — route the caller through the normal
    # 403 reject instead of publishing a resume nobody can answer.
    $var(ti) = $T(id_index);
    $var(tl) = $T(id_label);
    # tindex 0 = no transaction context: this is a UDP retransmission
    # re-entering request_route while the original INVITE's transaction
    # is already suspended in BILL_LOCK (Kamailio 6.0.1 re-injects
    # retransmissions into the route after t_suspend). Absorb it — a
    # second publish/suspend would corrupt the bookkeeping and a 403
    # would kill a call that is mid-RPC.
    if ($var(ti) == $null || $var(ti) == "" || $var(ti) == "0") {
        xlog("L_INFO", "bill-lock retransmission absorbed for $ci (already suspended)\n");
        exit;
    }
    if ($var(tl) == $null || $var(tl) == "" || $var(tl) == "0") {
        xlog("L_INFO", "bill-lock retransmission absorbed for $ci (already suspended)\n");
        exit;
    }
    $var(body) = '{"call_id": "' + $ci + '", "from_user": "' + $fU + '", "to_user": "' + $rU + '"';
    $var(body) = $var(body) + ', "tindex": ' + $var(ti) + ', "tlabel": ' + $var(tl) + '}';
    # Reply-subject shard (BL_REPLY_SHARDS): tlabel mod K picks the
    # consumer child that will resume this tx — matches the four
    # subject_queue_group/event_route quadruples below. (Kamailio's
    # grammar has no % operator: tlabel - (tlabel/K)*K.)
    $var(shard) = $var(tl) - (($var(tl) / BL_REPLY_SHARDS) * BL_REPLY_SHARDS);
    $var(rsubj) = "gvos-edge-reply-@NODE@";
    if ($var(shard) > 0) {
        $var(rsubj) = "gvos-edge-reply-@NODE@-s" + $var(shard);
    }
    nats_publish("gvos.svc.call.start", $var(body), "$var(rsubj)");
    # Suspend bookkeeping for the janitor: KEY "tindex:tlabel",
    # VALUE the suspend unix_ts. The reply event route deletes the
    # marker before t_continue; the janitor ages by the VALUE, so a
    # stale marker can never double-continue a resumed transaction.
    $sht(billlock=>$var(ti):$var(tl)) = $TS;
    $sht(billlock=>ci:$var(ti):$var(tl)) = $ci;
    # Release-of-last-resort: t_continue CANNOT be called from a timer
    # route (tmx requires a SIP-message context — 'cannot get
    # transaction index'), so the janitor is GC-only and cannot resume
    # timed-out suspends. Instead bound the wait with tm's own INVITE
    # timer: t_set_fr(5s fr, 5s fr_inv) on the suspended transaction.
    # The caller sees 408 after 5s worst case (bus reply arrives in
    # ~10ms when the bus is alive; 5s covers the slowest legitimate
    # admission). Note: t_set_fr_inv (1-arg) is KEMI-only in this
    # build — t_set_fr(fr, fr_inv) is the script-layer form.
    t_set_fr(5000, 5000);
    if (!t_suspend()) {
        $sht(billlock=>$var(ti):$var(tl)) = $null;
        $sht(billlock=>ci:$var(ti):$var(tl)) = $null;
        sl_send_reply("500", "Suspend Failed");
        exit;
    }
    xlog("L_INFO", "bill-lock suspended $ci tx=$var(ti):$var(tl)\n");
    exit;
    #!else
    $var(body) = '{"call_id": "' + $ci + '", "from_user": "' + $fU + '", "to_user": "' + $rU + '"}';
    # Auth rides the query token: the 4-arg http_connect form cannot
    # carry headers (the 6-arg form does not exist in 6.0.1).
    $var(url) = "/v1/call/start?token=" + $env(GVOS_INTERNAL_TOKEN);
    $var(rc) = http_connect("gvcore", "$var(url)", "application/json", $var(body), "$var(gvr)");
    if ($var(rc) == 200) {
        xlog("L_INFO", "bill-lock ok for $ci\n");
        if ($var(gvr) =~ "\"record\":true") {
            # Recording requested for this call.
            if (start_recording()) {
                xlog("L_INFO", "recording ON for $ci\n");
            } else {
                xlog("L_WARN", "recording FAILED to engage for $ci\n");
            }
        }
    } else {
        xlog("L_WARN", "bill-lock REJECTED for $ci rc=$var(rc)\n");
        sl_send_reply("403", "Insufficient Balance");
        exit;
    }
    #!endif
}

#!ifdef WITH_NATS_RPC
# Bill-lock resume: the gv-core answer (envelope {code, body}) arrived
# on this node's reply subject with the suspend coordinates. Runs
# with failure-route semantics: re-run gateway selection, then either
# 403 (rejected) or relay to the chosen gateway.
route[BILL_LOCK_REPLY] {
    # The resumed message carries no event context: the suspend
    # coordinates in $T(id_index)/$T(id_label) recover the answer and
    # call-id parked by the reply event route.
    $var(blr_ans) = $sht(billlock=>ans:$T(id_index):$T(id_label));
    $var(blr_ci) = $sht(billlock=>ci:$T(id_index):$T(id_label));
    $sht(billlock=>ci:$T(id_index):$T(id_label)) = $null;
    $sht(billlock=>ans:$T(id_index):$T(id_label)) = $null;
    if ($var(blr_ans) == $null || $var(blr_ans) == "" || $var(blr_ans) == "timeout") {
        # Janitor already continued this suspend (slow reply raced
        # the timeout): the transaction is already released.
        exit;
    }
    $var(code) = 0;
    jansson_get("code", $var(blr_ans), "$var(code)");
    if ($var(code) == 200) {
        if ($var(blr_ans) =~ "\"rewrite_dest\":") {
            jansson_get("rewrite_dest", $var(blr_ans), "$var(rwd)");
            $sht(meta=>rw:$ci) = $var(rwd);
        }
        if ($var(blr_ans) =~ "\"record\":true") {
            if (start_recording()) {
                xlog("L_INFO", "recording ON for $var(blr_ci)\n");
            }
        }
        route(GW_DISPATCH);
        t_on_failure("GW_FAILOVER");
        if (!t_relay()) {
            t_reply("503", "No Gateway");
        }
        exit;
    }
    xlog("L_WARN", "bill-lock REJECTED for $var(blr_ci) code=$var(code)\n");
    t_reply("403", "Insufficient Balance");
    exit;
}

# Reply arrival: parse the suspend coordinates, park the answer where
# BILL_LOCK_REPLY can reach it (the resumed route has no $natsData
# context — the SIP message is what t_continue reprocesses), and
# continue the suspended transaction. The marker is the resume
# authority: it is deleted BEFORE t_continue, and the janitor deletes
# it (with the whole ti:tl family) on timeout — so a reply arriving
# for a suspend whose marker is gone is a LATE reply to a released
# transaction: dropped with a log instead of resurrecting it.
# Sharded subjects (BL_REPLY_SHARDS): each event_route is its own
# nats consumer child; the body is one shared route so the logic
# cannot drift between shards.
route[BILL_LOCK_REPLY_EVENT] {
    $var(ti) = 0;
    $var(tl) = 0;
    $var(ci2) = "";
    jansson_get("tindex", $natsData, "$var(ti)");
    jansson_get("tlabel", $natsData, "$var(tl)");
    jansson_get("call_id", $natsData, "$var(ci2)");
    if ($var(ci2) == "" || $var(ci2) == $null) {
        # Older envelopes nest it one level down.
        jansson_get("body.call_id", $natsData, "$var(ci2)");
    }
    if ($var(ti) == 0 && $var(tl) == 0) {
        # Not a bill-lock reply (plain svc answer ack): nothing to resume.
        return;
    }
    if ($var(ci2) == "" || $var(ci2) == $null) {
        xlog("L_WARN", "bill-lock reply without call_id: dropped\n");
        return;
    }
    $var(marker) = $sht(billlock=>$var(ti):$var(tl));
    if ($var(marker) == $null || $var(marker) == "") {
        # Janitor already released this suspend (marker gone): a late
        # reply must not t_continue a released transaction.
        xlog("L_WARN", "bill-lock LATE reply for $var(ci2) (already timed out): dropped\n");
        return;
    }
    # Delete the marker first: after t_continue this suspend is live
    # again and the janitor must not age it out.
    $sht(billlock=>$var(ti):$var(tl)) = $null;
    $sht(billlock=>ci:$var(ti):$var(tl)) = $var(ci2);
    $sht(billlock=>ans:$var(ti):$var(tl)) = $natsData;
    t_continue("$var(ti)", "$var(tl)", "BILL_LOCK_REPLY");
}

event_route[nats:gvos-edge-reply-@NODE@] {
    route(BILL_LOCK_REPLY_EVENT);
}
event_route[nats:gvos-edge-reply-@NODE@-s1] {
    route(BILL_LOCK_REPLY_EVENT);
}
event_route[nats:gvos-edge-reply-@NODE@-s2] {
    route(BILL_LOCK_REPLY_EVENT);
}
event_route[nats:gvos-edge-reply-@NODE@-s3] {
    route(BILL_LOCK_REPLY_EVENT);
}

# Janitor: 1s tick, GC-only. t_continue cannot be called from a timer
# route (tmx requires a SIP-message context; attempts log 'cannot get
# transaction index' and the resume route never runs — observed live).
# Caller release is bounded by t_set_fr_inv(5000) at suspend time: tm
# itself 408s the INVITE if no reply resumed it within 5s. The janitor
# therefore only deletes marker/ci/ans families whose suspend is older
# than 2s AND has no parked reply — the tm timeout is the release, the
# janitor is the cleanup (a resumed transaction's parked pair is left
# for the reply route; entries also age out via htable autoexpire).
route[BILLLOCK_JANITOR] {
    $var(now) = $TS;
    sht_iterator_start("blj", "billlock");
    # Batched walk: Kamailio's runaway-loop guard aborts the whole
    # route once a while() exceeds 100 iterations (measured 45 aborts
    # at 40CPS — every suspend parks 3 keys, so >33 concurrent
    # suspends tripped it and the janitor was dead exactly when the
    # bus needed it). Cap this tick at 90 and let the next 1s tick
    # continue: the family ages out via autoexpire either way.
    $var(seen) = 0;
    while (sht_iterator_next("blj") && $var(seen) < 90) {
        $var(seen) = $var(seen) + 1;
        $var(k) = $shtitkey(blj);
        if ($var(k) =~ "^[0-9]+:[0-9]+$") {
            $var(ti) = $(var(k){s.select,0,:});
            $var(tl) = $(var(k){s.select,1,:});
            $var(age) = $var(now) - $(shtitval(blj){s.int});
            if ($var(age) > 2) {
                $var(ansv) = $sht(billlock=>ans:$var(ti):$var(tl));
                if ($var(ansv) != $null && $var(ansv) != "") {
                    # A parked real envelope: the reply landed and its
                    # resume is in flight — leave the pair alone.
                    xlog("L_INFO", "bill-lock janitor: reply in flight for tx=$var(ti):$var(tl), skip\n");
                }
                else {
                    # tm's fr_inv owns the release (408); the marker
                    # family is dead bookkeeping — collect it.
                    $sht(billlock=>$var(k)) = $null;
                    $sht(billlock=>ans:$var(ti):$var(tl)) = $null;
                    $sht(billlock=>ci:$var(ti):$var(tl)) = $null;
                }
            }
        }
    }
    sht_iterator_end("blj");
}

# Timeout resume (legacy release path — the janitor can no longer
# reach this route: t_continue from timer context is impossible; kept
# for the documented history and any future event-context replayer).
route[BILL_LOCK_TIMEOUT] {
    $var(blt_ci) = $sht(billlock=>ci:$T(id_index):$T(id_label));
    $sht(billlock=>ci:$T(id_index):$T(id_label)) = $null;
    xlog("L_ERR", "bill-lock TIMEOUT for $var(blt_ci) (no reply on bus)\n");
    t_reply("503", "Billing Unavailable");
    exit;
}
#!endif

# Gateway selection from the NATS-mirrored gw htable: pick the
# highest-priority (lowest prio value) enabled gateway, skipping any
# in the gwfail cooldown window. Records the choice on meta:gw:<ci>
# (failover exclusion + ACK/BYE relay without a Route header). Empty
# table = 503 (nothing routable).
route[GW_DISPATCH] {
    $sht(meta=>gw:$ci) = $null;
    $var(best) = "";
    $var(bestprio) = 2147483647;
    # Total enabled gateways (independent of lockouts): the
    # last-gateway protection below needs it.
    $var(total) = 0;
    sht_iterator_start("gwit", "gw");
    while (sht_iterator_next("gwit")) {
        $var(k) = $shtitkey(gwit);
        if ($var(k) =~ "^dest:") {
            $var(id) = $(var(k){s.substr,5,100});
            if ($sht(gw=>en:$var(id)) != $null) {
                $var(total) = $var(total) + 1;
                if ($sht(gwfail=>fail:$var(id)) == $null) {
                    $var(p) = $sht(gw=>prio:$var(id));
                    if ($var(p) == $null || $var(p) == "") {
                        $var(p) = 0;
                    }
                    if ($var(p) < $var(bestprio)) {
                        $var(bestprio) = $var(p);
                        $var(best) = $var(id);
                    }
                }
            }
        }
    }
    sht_iterator_end("gwit");
    if ($var(best) == "") {
        # Last-gateway protection: an EMPTY routable set with a
        # non-empty total means every gateway is in gwfail cooldown.
        # Locking the ONLY gateway out converts one bad minute into a
        # 5-minute fleet outage (measured: 7057 x 503 in one round).
        # A single-gw deployment must keep trying its one gateway —
        # fail-open with a log; multi-gw fleets keep the lockout
        # (failover still has somewhere to go).
        if ($var(total) == 1) {
            sht_iterator_start("gwit2", "gw");
            while (sht_iterator_next("gwit2")) {
                $var(k2) = $shtitkey(gwit2);
                if ($var(k2) =~ "^dest:") {
                    $var(best) = $(var(k2){s.substr,5,100});
                }
            }
            sht_iterator_end("gwit2");
            xlog("L_WARN", "last gateway $var(best) locked out — failing open for $ci\n");
        }
    }
    if ($var(best) == "") {
        xlog("L_ERR", "no routable gateway for $ci (empty or all cooling down)\n");
        sl_send_reply("503", "No Gateway");
        exit;
    }
    $sht(meta=>gw:$ci) = $var(best);
    $du = $sht(gw=>dest:$var(best));
    xlog("L_INFO", "dispatching $ci to gw $var(best) $du\n");
}

# Gateway failure handling: the transaction failed on the chosen
# gateway — lock it out for 5 minutes (gwfail autoexpire) and retry
# the next-best gateway once. The lockout heals by autoexpire (cheap
# retry) or by an operator disabling the gateway via the API.
failure_route[GW_FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }
    $var(id) = $sht(meta=>gw:$ci);
    if ($var(id) != $null && $var(id) != "") {
        # Failure threshold before lockout (GWFAIL_THRESHOLD): ONE
        # 408 under a burst used to lock the only gateway for 5
        # minutes — 8681 calls got 503 'no routable gateway' after
        # the very first tail loss (measured, 100CPS round 1).
        # Count consecutive failures; the counter resets whenever
        # the gateway answers anything (onreply_route marks gwok).
        $var(fails) = $sht(gwfail=>cnt:$var(id));
        if ($var(fails) == $null || $var(fails) == "") {
            $var(fails) = 0;
        }
        $var(fails) = $var(fails) + 1;
        $sht(gwfail=>cnt:$var(id)) = $var(fails);
        # (no >= operator in the 6.0.1 grammar; compares must use
        # plain literals — lock on the 3rd consecutive failure,
        # matching the GWFAIL_THRESHOLD doc)
        if ($var(fails) > 2) {
            $sht(gwfail=>fail:$var(id)) = 1;
            xlog("L_WARN", "gateway $var(id) failed x$var(fails) for $ci: locked out 5m\n");
        } else {
            xlog("L_INFO", "gateway $var(id) transient failure x$var(fails) for $ci (no lockout yet)\n");
        }
    }
    # One failover attempt: re-run selection (skips the locked
    # gateway). A second failure answers upstream via t_relay's own
    # failure propagation. Below the threshold the same gateway
    # stays selectable — GW_DISPATCH will re-pick it; a fresh
    # dispatch of the SAME tx is fine (new branch, new timer).
    route(GW_DISPATCH);
    if (!t_relay()) {
        t_reply("503", "No Gateway");
    }
}

# In-dialog ACK/BE without a Route header: relay to the gateway the
# INVITE selected (meta:gw), falling back to a re-selection when the
# call state is gone (very late BYE after a restart). An ACK with no
# recorded gateway is a transaction ACK for a rejected INVITE (e.g. a
# 401 Digest challenge) — no call was ever established on this
# call-id, so re-dispatching it toward a gateway is wrong (the agent
# worker answers 481). Drop it; BYE still falls back to re-selection
# because late-BYE-after-restart must not be lost.
route[GW_CONTACT] {
    $var(id) = $sht(meta=>gw:$ci);
    if ($var(id) != $null && $var(id) != "" && $sht(gw=>dest:$var(id)) != $null) {
        $du = $sht(gw=>dest:$var(id));
        return;
    }
    if (is_method("ACK")) {
        xlog("L_INFO", "dropping routeless ACK without gateway for $ci (challenge/reject ACK)\n");
        exit;
    }
    route(GW_DISPATCH);
}

route[CDR_EVENT] {
    # Re-publish guard: a BYE retransmission that slipped past the
    # in-dialog t_check_trans (or a duplicated transport delivery)
    # must not re-publish cdr.raw — the first publish cleared the
    # an/st family, so a republish would carry duration=0 and poison
    # the CDRR consumer (measured 7381 redeliveries at 40CPS×10).
    # cd:<ci> is the one-shot sentinel (cleared with the rest).
    if ($sht(meta=>cd:$ci) != $null && $sht(meta=>cd:$ci) != 0) {
        xlog("L_INFO", "cdr.raw duplicate end suppressed for $ci\n");
        exit;
    }
    $sht(meta=>cd:$ci) = 1;
    # Compose the end event with measured metadata:
    #   duration_ms = BYE time - answer time (µs clock: the $TS
    #                second-granular subtraction truncated 11% of
    #                sub-second calls to duration 0)
    #   pdd_ms      = first 200 - INVITE arrival
    #   sip_code    = 200 on the normal BYE path
    #   qos         = rtpengine's per-call stats ($rtpstat, populated by
    #                 the rtpengine_manage call that handled this BYE)
    $var(dur) = 0;
    if ($sht(meta=>an:$ci) > 0) {
        $var(dur) = ($TS - $sht(meta=>an:$ci)) * 1000
                  + ($TV(u) - $sht(meta=>anus:$ci)) / 1000;
    }
    $var(pdd) = 0;
    if ($sht(meta=>st:$ci) > 0 && $sht(meta=>an:$ci) > 0) {
        # Microsecond-precision PDD: (an - st) whole seconds plus the
        # usec delta, rounded to milliseconds.
        $var(secs) = $sht(meta=>an:$ci) - $sht(meta=>st:$ci);
        $var(usdiff) = $sht(meta=>anus:$ci) - $sht(meta=>stus:$ci);
        $var(pdd) = $var(secs) * 1000 + ($var(usdiff) / 1000);
    }
    # Answer timestamp epoch-ms: lets the CDR carry the real answer
    # time (the answer event route already parked an/anus; both were
    # taken BEFORE this BYE, so this is the connected-since moment).
    $var(anms) = 0;
    if ($sht(meta=>an:$ci) > 0) {
        $var(anms) = $sht(meta=>an:$ci) * 1000 + $sht(meta=>anus:$ci) / 1000;
    }
    $var(qos) = "";
    if ($rtpstat != $null && $rtpstat != "") {
        # Escape embedded quotes so the stats land as one JSON string.
        $var(qos) = $(rtpstat{s.escape.common});
    }
    $var(body) = '{"call_id": "' + $ci + '", "event": "end", "duration": ' + $var(dur) + ', "duration_ms": ' + $var(dur) + ', "answer_ts": ' + $var(anms) + ', "pdd_ms": ' + $var(pdd) + ', "sip_code": 200, "release": "normal", "qos": "' + $var(qos) + '"}';
    #!ifdef WITH_NATS_CDR
    # Bus transport: async publish; the CDRR worker in gv-core owns
    # finalization + persistence (at-least-once, uq_cdr_call dedup).
    nats_publish("gvos.cdr.raw", $var(body));
    #!else
    # Auth rides the query token (the 4-arg http_connect form cannot
    # carry headers).
    $var(url) = "/v1/call/end?token=" + $env(GVOS_INTERNAL_TOKEN);
    $var(rc) = http_connect("gvcore", "$var(url)", "application/json", "$var(body)", "$var(gvr)");
    if ($var(rc) != 200) {
        xlog("L_ERR", "cdr event failed for $ci rc=$var(rc)\n");
    }
    #!endif
    $sht(meta=>an:$ci) = $null;
    $sht(meta=>st:$ci) = $null;
    $sht(meta=>anus:$ci) = $null;
    $sht(meta=>stus:$ci) = $null;
    # cd:<ci> is deliberately NOT cleared: it is the one-shot
    # publish guard for this call-id's cdr.raw. Keeping it until the
    # htable autoexpire (600s) means a BYE retransmission that
    # re-enters CDR_EVENT (new tm branch — t_check_trans cannot
    # absorb it once the first BYE's transaction is gone) is
    # suppressed here, at the source. Without this the re-published
    # cdr.raw can race the first one inside the CDRR worker and
    # double-write the CDR (the uq_cdr_call index only catches
    # rows with identical start_time — the second End recomputes
    # it, measured live: same call_id twice in cdr, 78s apart).
}

# Registration event publish: gv-core mirrors the network-wide
# registration state and feeds reg_freq fraud rules from this feed.
route[REG_EVENT] {
    #!ifdef WITH_NATS
    # The granted expiry (registrar clamps it to max_expires): use
    # the Expires header value directly; default 0 when absent.
    $var(exp) = 0;
    if ($hdr(Expires) != $null) {
        $var(exp) = $hdr(Expires);
    }
    $var(body) = '{"user": "' + $fU + '", "op": "reg", "expires": ' + $var(exp) + ', "src_ip": "' + $si + '"}';
    nats_publish("gvos.reg.event", $var(body));
    #!else
    xlog("L_INFO", "reg event $fU (no nats transport)
");
    #!endif
}

# Answer/200 handling: notify gv-core that the call connected. Uses
# $rs (reply status) and @CSeq.method for the method on replies (the
# $rm PV on the reply path reflects the reply's transaction method,
# which is what we want). Records answer time for the duration
# measurement.
# Transport: NATS request/reply on gvos.svc.call.answer when the bus
# carries signaling (fire-and-ack: the reply lands on the node reply
# subject and is a no-op there — no suspend to resume); HTTP
# /v1/call/answer otherwise.
onreply_route {
    if ($rs == "200" && $rm == "INVITE") {
        $sht(meta=>an:$ci) = $TV(s);
        $sht(meta=>anus:$ci) = $TV(u);
        $sht(meta=>ttag:$ci) = $tt;
        # Gateway answered: reset the consecutive-failure counter
        # (GWFAIL_THRESHOLD lockout counts runs of failures only).
        $var(gwid) = $sht(meta=>gw:$ci);
        if ($var(gwid) != $null && $var(gwid) != "") {
            $sht(gwfail=>cnt:$var(gwid)) = $null;
        }
        $var(body) = '{"call_id": "' + $ci + '", "event": "answer"}';
        #!ifdef WITH_NATS
        nats_publish("gvos.svc.call.answer", $var(body));
        #!else
        $var(rc) = http_connect("gvcore", "/v1/call/answer", "application/json", "$var(body)", "$var(gvr)");
        if ($var(rc) != 200) {
            xlog("L_ERR", "answer event failed for $ci rc=$var(rc)\n");
        }
        #!endif
    }
}

# WebSocket upgrade: browsers hit the TLS listener with an HTTP GET
# upgrade request; xhttp routes it here and websocket answers.
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET") {
        if (!ws_handle_handshake()) {
            xhttp_reply("500", "Internal Server Error", "", "");
        }
        return;
    }
    xhttp_reply("404", "Not Found", "", "");
}

# ---- NATS event routes ----

# Config reload broadcast: gv-core is the authority; payloads are
# full-array and idempotent (safe to apply any number of times —
# gv-core re-broadcasts every 60s as the reconciliation heartbeat).
#!ifdef WITH_NATS
event_route[nats:gvos-edge-cfg] {
    $var(entity) = "";
    jansson_get("entity", $natsData, "$var(entity)");
    if ($var(entity) == "gateway") {
        route(GW_SYNC);
    } else if ($var(entity) == "ip_allowlist") {
        route(IPALLOW_APPLY);
    } else if ($var(entity) == "blocklist") {
        route(BL_APPLY);
    }
    # Other entities (rate/account/credit/recording/risk/package) are
    # control-plane-internal: gv-core replicas apply them, not us.
}
#!endif

# Gateway snapshot apply: rebuild the gw htable from the full array
# (wipe dest: keys first — stale entries for removed gateways must
# go — then re-insert).
#!ifdef WITH_NATS
route[GW_SYNC] {
    sht_iterator_start("wipe", "gw");
    while (sht_iterator_next("wipe")) {
        $var(k) = $shtitkey(wipe);
        if ($var(k) =~ "^dest:") {
            $sht(gw=>$var(k)) = $null;
        }
    }
    sht_iterator_end("wipe");
    $var(cnt) = 0;
    jansson_array_size("gateways", $natsData, "$var(cnt)");
    $var(n) = 0;
    while ($var(n) < $var(cnt)) {
        $var(id) = "";
        $var(addr) = "";
        $var(prio) = 0;
        $var(en) = "0";
        $var(path) = "gateways[" + $var(n) + "]";
        jansson_get("$var(path).id", $natsData, "$var(id)");
        jansson_get("$var(path).sip_addr", $natsData, "$var(addr)");
        jansson_get("$var(path).priority", $natsData, "$var(prio)");
        jansson_get("$var(path).enabled", $natsData, "$var(en)");
        if ($var(id) != "" && $var(id) != $null && $var(addr) != "" && $var(addr) != $null) {
            $sht(gw=>dest:$var(id)) = "sip:" + $var(addr);
            $sht(gw=>prio:$var(id)) = $var(prio);
            if ($var(en) == "1" || $var(en) == "true") {
                $sht(gw=>en:$var(id)) = 1;
            }
        }
        $var(n) = $var(n) + 1;
    }
    xlog("L_INFO", "GW_SYNC applied $var(n) gateways via NATS\n");
}
#!endif

# IP allowlist apply from the broadcast (same rules-array shape as
# the snapshot endpoint). The 30s poll remains as reconciliation.
#!ifdef WITH_NATS
route[IPALLOW_APPLY] {
    # gv-core pre-joins the CIDR lists in the broadcast payload (same
    # contract as the snapshot endpoint) — dynamic jansson array
    # indexing is not supported, so the strings are the contract.
    $var(allows) = "";
    $var(denies) = "";
    jansson_get("allow_cidrs", $natsData, "$var(allows)");
    jansson_get("deny_cidrs", $natsData, "$var(denies)");
    $sht(ipallow=>allowlist) = $var(allows);
    $sht(ipallow=>denylist) = $var(denies);
    $sht(ipallow=>ver) = "nats";
    xlog("L_INFO", "ipallow applied via NATS allows=$var(allows) denies=$var(denies)
");
}
#!endif

# Blocklist apply (per-op broadcasts + the 60s full replay): add or
# remove black dest prefixes in the bl mirror. White/regex rules stay
# in gv-core — the edge screens prefixes only.
#!ifdef WITH_NATS
route[BL_APPLY] {
    $var(op) = "";
    jansson_get("op", $natsData, "$var(op)");
    $var(kind) = "";
    $var(scope) = "";
    $var(pattern) = "";
    jansson_get("entry.kind", $natsData, "$var(kind)");
    jansson_get("entry.scope", $natsData, "$var(scope)");
    jansson_get("entry.pattern", $natsData, "$var(pattern)");
    if ($var(kind) != "black" || $var(scope) != "dest") {
        return;
    }
    if ($var(pattern) == "" || $var(pattern) == $null) {
        return;
    }
    if ($var(op) == "remove") {
        if ($sht(bl=>bl:dest:$var(pattern)) != $null) {
            $sht(bl=>bl:dest:$var(pattern)) = $null;
            $sht(bl=>count) = $sht(bl=>count) - 1;
        }
    } else {
        if ($sht(bl=>bl:dest:$var(pattern)) == $null) {
            $sht(bl=>bl:dest:$var(pattern)) = 1;
            if ($sht(bl=>count) == $null) {
                $sht(bl=>count) = 0;
            }
            $sht(bl=>count) = $sht(bl=>count) + 1;
        }
    }
    xlog("L_INFO", "bl applied $var(op) dest prefix $var(pattern) via NATS\n");
}
#!endif

# Risk alert: ban the username at the SIP edge (banned htable, 1h
# autoexpire; the admin plane lifts it by adjusting the rule set —
# a re-broadcast re-arms nothing here, entries simply age out).
#!ifdef WITH_NATS
event_route[nats:gvos-edge-risk] {
    $var(user) = "";
    jansson_get("username", $natsData, "$var(user)");
    if ($var(user) == "" || $var(user) == $null) {
        # Payload without username (account id only): the edge keys on
        # $fU and cannot map an account id — skip with a log.
        xlog("L_WARN", "risk alert without username: ignored at edge\n");
        return;
    }
    $sht(banned=>acc:$var(user)) = 1;
    xlog("L_WARN", "RISK ban user $var(user) at SIP edge (1h)\n");
}
#!endif

# Forced teardown (balance exhausted): every node receives the
# broadcast; the node holding the dialog terminates it via the
# dialog module's RPC, the rest no-op. The gv-core TEARDOWN durable
# consumer retries while any node is down; this route is the
# bus-side executor.
#!ifdef WITH_NATS
event_route[nats:gvos-edge-tear] {
    $var(cid) = "";
    jansson_get("call_id", $natsData, "$var(cid)");
    if ($var(cid) == "" || $var(cid) == $null) {
        return;
    }
    # dlg.terminate_dlg requires (callid, from-tag, to-tag). Both tags
    # are parked at INVITE ($ft) and at the 200 reply ($tt) — this
    # node holds the dialog iff both slots exist; other broadcast
    # recipients see empty slots and no-op silently. The lookups MUST
    # key on the parsed $var(cid): there is no SIP message in a NATS
    # event route, so $ci is empty here and would miss every slot.
    $var(ftag) = $sht(meta=>ftag:$var(cid));
    $var(ttag) = $sht(meta=>ttag:$var(cid));
    if ($var(ftag) == $null || $var(ttag) == $null || $var(ftag) == "" || $var(ttag) == "") {
        xlog("L_INFO", "TEARDOWN no dialog on this node for $var(cid) (no-op)\n");
        return;
    }
    $var(rpcbody) = '{"jsonrpc":"2.0","method":"dlg.terminate_dlg","params":["' + $var(cid) + '","' + $var(ftag) + '","' + $var(ttag) + '"],"id":1}';
    jsonrpc_exec("$var(rpcbody)");
    if ($(jsonrpl(code){s.int}) == 200) {
        xlog("L_INFO", "TEARDOWN terminated dialog $var(cid) via bus\n");
    } else {
        xlog("L_WARN", "TEARDOWN terminate failed for $var(cid) code=$(jsonrpl(code){s.int})\n");
    }
}
#!endif

# usrloc expiry feed: publish the expire event so the gv-core
# registration mirror marks the user offline. The expired contact is
# exposed via the registrar's $ulc profile "exp" (aor = user@domain;
# the user part feeds the mirror, the domain part is the local realm).
event_route[usrloc:contact-expired] {
    #!ifdef WITH_NATS
    $var(aor) = $ulc(exp=>aor);
    $var(user) = $(var(aor){s.select,0,@});
    $var(body) = '{"user": "' + $var(user) + '", "op": "expire", "expires": 0, "src_ip": ""}';
    nats_publish("gvos.reg.event", $var(body));
    #!else
    xlog("L_INFO", "usrloc contact expired (no nats transport)\n");
    #!endif
}
