# G-VOS Kamailio routing script.
#
# Flow (matches docs/02-architecture.md §3.1):
#   INVITE -> auth check -> rating lock via gv-core HTTP -> route
#   dispatch to gateway -> on answer RTPengine engaged -> BYE -> CDR
#   event to gv-core.
#
# NATS plane (2026-11): the edge subscribes to gvos.cfg.reload
# (gateway/ip_allowlist/blocklist snapshots), gvos.risk.alert (SIP-edge
# ban htable) and gvos.call.teardown (dlg termination); it publishes
# gvos.reg.event (usrloc hooks) and gvos.cdr.raw (BYE events, when
# GVOS_CDR_TRANSPORT=nats). /v1/call/start stays HTTP: it is a
# synchronous decision point and the nats module publishes
# asynchronously only.
#
# Queue groups: every node uses its own (GVOS_NODE_HOST-derived) queue
# group. Core NATS delivers one copy per DISTINCT queue group, so
# unique-per-node groups = every node gets a copy (a shared group
# would load-balance and each node would see only a slice). The nats
# module requires a non-empty group after the colon — an empty group
# string walks off the string end in the module parser and fails
# validation in libnats anyway.

#!KAMAILIO
debug=2
log_stderror=yes

alias="gvos.local"

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
# WebSocket entry for browser/WebRTC endpoints (AI media plane path).
listen=tls:0.0.0.0:4444

# TLS engine flag must parse BEFORE modules load (tls.so reads it at
# registration time).
enable_tls=1
tcp_accept_no_cl=yes

# --- NATS / transport env. GVOS_NODE_HOST must be unique per
# signaling node (compose sets kamailio-1/2; k8s uses the pod name):
# it builds the per-node broadcast queue group.
#!defenv GVOS_NODE_HOST
# WITH_NATS is env-driven: set WITH_NATS=1 on deployments whose image
# ships the nats module (Debian kamailio-nats-modules). The Alpine CI
# image does not include it - leave unset there, the HTTP paths stay.
#!trydefenv WITH_NATS
# CDR transport: WITH_NATS_CDR=1 switches route[CDR_EVENT] from the
# /v1/call/end HTTP call to nats_publish("gvos.cdr.raw").
#!trydefenv WITH_NATS_CDR


# --- modules (mpath: Debian multiarch layout first, upstream layout
# second — works on both the trixie package image and source builds)
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/:/usr/lib/kamailio/modules/"
loadmodule "tls.so"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "htable.so"
loadmodule "http_client.so"
loadmodule "json.so"
loadmodule "corex.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "rtpengine.so"

# --- TLS for the WebSocket listener.
modparam("tls", "certificate", "/etc/kamailio/tls/kamailio-cert.pem")
modparam("tls", "private_key", "/etc/kamailio/tls/kamailio-key.pem")
modparam("tls", "tls_method", "TLSv1.2")
loadmodule "nathelper.so"
loadmodule "jansson.so"
loadmodule "timer.so"
loadmodule "ipops.so"
loadmodule "sqlops.so"
# dialog: per-call state so teardown broadcasts can terminate the
# dialog on the node that holds it.
loadmodule "dialog.so"
# nats: event bus edge, when the module exists in this image (Debian
# builds ship kamailio-nats-modules; the Alpine CI image does not).
# WITH_NATS controls the modparams + publish routes below.
#!ifdef WITH_NATS
loadmodule "nats.so"
#!endif

# --- timer: periodic allowlist snapshot poll — the reconciliation
# fallback. Primary sync is the gvos.cfg.reload NATS broadcast
# (route[IPALLOW_APPLY]); where the image has no nats module (Alpine
# CI), this poll is the only sync channel. Fires every 30s.
modparam("timer", "declare_timer", "ipallow_poll=IPALLOW_POLL,30000,slow,enable")

#!ifdef WITH_NATS
# --- NATS subscriptions: per-node queue group (GVOS_NODE_HOST with
# non-alphanumerics folded to '-' — queue names must be plain).
# Subjects are the dot-free edge aliases (gv-core dual-publishes the
# canonical dotted originals for core replicas + JetStream; the
# event_route lexer cannot express dots, so the edge listens here).
# 1) gvos-edge-cfg:  gateway / ip_allowlist / blocklist snapshots.
# 2) gvos-edge-risk: ban htable at the SIP edge.
# 3) gvos-edge-tear: dlg termination (holder executes, others no-op
#    on the dlg lookup).
#!substdef "/GVOS_QG/!!{GVOS_NODE_HOST}/"
modparam("nats", "nats_url", "nats://nats:4222")
modparam("nats", "num_publish_workers", 2)
modparam("nats", "subject_queue_group", "gvos-edge-cfg:GVOS_QG")
modparam("nats", "subject_queue_group", "gvos-edge-risk:GVOS_QG")
modparam("nats", "subject_queue_group", "gvos-edge-tear:GVOS_QG")
#!endif

# --- core params
fork=yes
children=4

# --- http_client (gv-core event API)
modparam("http_client", "httpcon", "gvcore=>http://gv-core:8080")
# Internal snapshot poll (IP allowlist) — same connection, bounded.
modparam("http_client", "connection_timeout", 2)
# Self-signed cert: do not verify the gv-core TLS chain (docker network).

# --- sqlops: direct column reads for the auth HA1 cache fill.
modparam("sqlops", "sqlcon", "gvdb=>postgres://gvos:gvos_dev@postgres:5432/gvos")

# --- auth: Digest against the PostgreSQL accounts table.
# DB is the fallback only: the authcache htable below serves HA1s from
# memory, so the steady-state call path performs zero DB queries.
modparam("auth_db", "db_url", "postgres://gvos:gvos_dev@postgres:5432/gvos")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "password_column", "ha1")
#!subst "/REALM/gvos.local/"

# --- htable: per-account live-call counters (guard max_concurrent)
modparam("htable", "htable", "livecalls=>size=10;autoexpire=0;")

# --- htable: call metadata. Key = call-id.
#   meta:st:<ci>   INVITE receive time (ms) for PDD
#   meta:an:<ci>   200 OK time (ms) for duration
#   meta:gw:<ci>   chosen gateway id (failover skip + ACK/BYE relay
#                  without a Route header)
modparam("htable", "htable", "meta=>size=10;autoexpire=600;")

# --- htable: IP allowlist mirror (source-IP admission control).
#   ipallow:allowlist / ipallow:denylist  comma-joined CIDR lists
#   ipallow:ver      snapshot version ("nats" once a broadcast lands)
#   Primary sync: gvos.cfg.reload (route[IPALLOW_APPLY]); the 30s
#   poll (route[IPALLOW_POLL]) reconciles drift.
modparam("htable", "htable", "ipallow=>size=10;autoexpire=0;")

# --- htable: Digest HA1 cache (auth_db fallback fill).
#   auth:ha1:<username> -> HA1 value. Long TTL; NATS account.changed
#   broadcasts invalidate stale entries via the snapshot side-channel.
modparam("htable", "htable", "authcache=>size=10;autoexpire=86400;")

# --- htable: outbound gateway directory (NATS-mirrored).
#   gw:dest:<id>  "sip:<host:port>"
#   gw:prio:<id>  selection priority (lower = preferred)
#   gw:en:<id>    "1" when enabled (absent = disabled)
#   Applied by route[GW_SYNC] from the gvos.cfg.reload broadcast;
#   empty table = nothing routable (503).
modparam("htable", "htable", "gw=>size=10;autoexpire=0;")

# --- htable: risk bans + per-gateway failure cooldown.
#   banned:acc:<username>  risk.alert hit -> 403 at the edge (1h TTL)
#   gwfail:<id>            failure_route lockout, 5min auto-retry
#   (value keys carry a "v:" prefix to keep sht_iterator probes
#   distinct from the en:/prio: siblings)
modparam("htable", "htable", "banned=>size=10;autoexpire=3600;")
modparam("htable", "htable", "gwfail=>size=10;autoexpire=300;")

# --- htable: destination black-list mirror (prefix screening).
#   bl:bl:dest:<pattern>  black dest prefixes
#   bl:count              active prefix count (fast bail-out)
#   Applied by route[BL_APPLY]; white/regex semantics stay in gv-core
#   (defense in depth: the edge screens prefixes only).
modparam("htable", "htable", "bl=>size=10;autoexpire=0;")

# --- registrar: memory-only location (no db_mode; registrations are
# hot state, they do not survive restarts by design). gvos.reg.event
# publishes give the control plane network-wide visibility.
modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_expires", 3600)

# --- rtpengine: media plane. Media flows through rtpengine so the
# recording fork and QoS stats have a place to hook.
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")

# --- dialog: track dialogs for teardown termination.
modparam("dialog", "default_timeout", 21600) # 6h hard cap

####### Routing logic ########

request_route {
    route(REQ_SANITY);

    # Source-IP admission (allowlist mirror in htable, zero DB per
    # request). WS-originated traffic is exempt: it arrives from the
    # local TLS listener and was already admitted by the upgrade.
    if (proto != WS && proto != WSS) {
        route(IPALLOW_CHECK);
    }

    if (has_totag()) {
        # In-dialog requests (ACK, BYE, re-INVITE): route along the
        # record-route path.
        xlog("L_INFO", "in-dialog $rm for $ci\n");
        rtpengine_manage("replace-origin replace-session-connection");
        if (loose_route()) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        # No Route header (UAC sent ACK straight to the Contact): the
        # 2xx Contact points at the gateway - relay there directly.
        if (is_method("ACK|BYE")) {
            if (is_method("BYE")) {
                route(CDR_EVENT);
            }
            route(GW_CONTACT);
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        sl_send_reply("400", "Bad Routing");
        exit;
    }

    if (is_method("REGISTER")) {
        # Registration with the same Digest auth as INVITE: challenge
        # then verify against accounts (cache-first, DB fallback),
        # then save the location.
        route(AUTH_CACHE);
        if (!save("location")) {
            sl_reply_error();
        }
        # Publish the registration event: gv-core mirrors the
        # network-wide registration state (observability + reg_freq
        # fraud rules) from gvos.reg.event.
        route(REG_EVENT);
        exit;
    }

    # SIP-over-WS messages from upgraded connections arrive as normal
    # requests on this path once the xhttp upgrade below completed.

    if (is_method("INVITE")) {
        # Risk-edge ban first: a gv-core risk.alert hit lands in the
        # banned htable and rejects the next INVITE with zero
        # control-plane round trips (1h auto-expire).
        if ($sht(banned=>acc:$fU) != $null) {
            xlog("L_WARN", "BANNED user $fU rejected at edge\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        # Destination prefix screening (bl mirror, zero DB).
        route(BL_CHECK);
        # SIP Digest auth: 401 challenge, then verify (cache-first,
        # DB fallback only on a cache miss).
        route(AUTH_CACHE);
        record_route();  # stay in the path so ACK/BYE traverse us
        dlg_manage();    # per-dialog state: teardown broadcasts find it
        # Engage rtpengine: SDP c=/m= lines rewritten to point media
        # at the relay (recording fork + QoS stats hook here later).
        rtpengine_manage("replace-origin replace-session-connection");
        # Mark INVITE arrival for PDD measurement ($TV: µs-precision
        # clock; $TS is second-granular and rounds local PDD to 0).
        $sht(meta=>st:$ci) = $TV(s);
        $sht(meta=>stus:$ci) = $TV(u);
        route(BILL_LOCK);
        route(GW_DISPATCH);
        t_on_failure("GW_FAILOVER");
    }

    # Forward statefully via the route set by GW_DISPATCH.
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[REQ_SANITY] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        xlog("L_WARN", "sanity failed from $si\n");
        exit;
    }
}

# Source-IP admission: the ipallow htable mirror holds the
# comma-joined CIDR lists. Deny exceptions first (explicit deny beats
# broad allow), then the allow list; no match = default-deny. All in
# memory, zero DB per request. No snapshot loaded yet
# ($sht(ipallow=>ver) empty) = fail-open with a loud log: the demo
# stack starts with an empty allowlist, and the sync timer populates
# it; production sets GVOS_INTERNAL_TOKEN so the poller runs and the
# table is authoritative before traffic flows.
route[IPALLOW_CHECK] {
    # No snapshot loaded yet -> fail-open (demo bootstrap; production
    # sets GVOS_INTERNAL_TOKEN so the poller populates before traffic).
    if ($sht(ipallow=>ver) == $null) {
        return;
    }
    # Deny exceptions first (explicit deny beats broad allow).
    if ($sht(ipallow=>denylist) != $null && $sht(ipallow=>denylist) != "") {
        if (is_in_subnet("$si", "$sht(ipallow=>denylist)")) {
            xlog("L_WARN", "ipallow DENY $si matched deny exception\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
    }
    if ($sht(ipallow=>allowlist) == $null || $sht(ipallow=>allowlist) == "") {
        xlog("L_WARN", "ipallow REJECT $si: empty allow set (default-deny)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    if (!is_in_subnet("$si", "$sht(ipallow=>allowlist)")) {
        xlog("L_WARN", "ipallow REJECT $si: no allow rule matched (default-deny)\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
}

# Destination prefix screening: black-list mirror in the bl htable.
# Probe $rU from full length downward (<= 20 hash probes); a hit =
# 403 at the edge with zero control-plane cost. White-list and regex
# semantics stay in gv-core (defense in depth).
route[BL_CHECK] {
    if ($sht(bl=>count) == $null || $sht(bl=>count) == 0) {
        return;
    }
    $var(num) = $rU;
    $var(len) = $(var(num){s.len});
    while ($var(len) > 0) {
        $var(pat) = $(var(num){s.substr,0,$var(len)});
        if ($sht(bl=>bl:dest:$var(pat)) != $null) {
            xlog("L_WARN", "BL block dest $rU matched prefix $var(pat)\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        $var(len) = $var(len) - 1;
    }
}

# Digest auth, cache-first: the authcache htable serves the HA1 so the
# steady-state call path never queries PostgreSQL. DB (auth_db) stays
# as the cache-miss fallback; a successful DB pass fills the cache via
# one sqlops read of the same column www_authorize checked.
route[AUTH_CACHE] {
    if ($sht(authcache=>ha1:$fU) != $null) {
        $avp(ha1cache) = $sht(authcache=>ha1:$fU);
        if (pv_www_authenticate("REALM", "$avp(ha1cache)", "0")) {
            return;
        }
        # Stale or wrong credentials: challenge (the next successful
        # DB pass refreshes the cache entry).
        www_challenge("REALM", "0");
        exit;
    }
    if (!www_authorize("REALM", "accounts")) {
        www_challenge("REALM", "0");
        exit;
    }
    # Cache fill after a successful DB authentication: one column
    # read via sqlops, then the steady state runs from htable alone.
    $var(q) = "select ha1 from accounts where username='" + $fU + "' and deleted_at is null";
    if (sql_query("gvdb", "$var(q)", "rl")) {
        if ($dbr(rl=>rows) > 0) {
            $sht(authcache=>ha1:$fU) = $dbr(rl=>[0,0]);
            xlog("L_INFO", "authcache: cached HA1 for $fU\n");
        }
        sql_result_free("rl");
    }
}

# Periodic allowlist snapshot poll (30s timer): reconciliation
# fallback for the NATS broadcast (a node that missed broadcasts —
# restart, reconnect window — converges here). Pulls the
# version-stamped snapshot and rebuilds two comma-joined CIDR lists
# (allowlist/denylist) that IPALLOW_CHECK feeds to is_in_subnet — two
# function calls per request, zero iteration.
route[IPALLOW_POLL] {
    $var(url) = "http://" + $env(GVOS_CORE_HOST) + ":8080/v1/internal/ipallow-snapshot";
    $var(hdrs) = "X-GVOS-Internal: " + $env(GVOS_INTERNAL_TOKEN) + "
";
    $var(rc) = http_client_request("GET", "$var(url)", "", "$var(hdrs)", "$var(gvr)");
    if ($var(gvr) == $null) {
        return;
    }
    if ($var(rc) != 200) {
        xlog("L_WARN", "ipallow sync failed rc=$var(rc)
");
        return;
    }
    $var(newver) = "";
    jansson_get("version", $var(gvr), "$var(newver)");
    if ($var(newver) == $sht(ipallow=>ver)) {
        return;
    }
    # gv-core pre-joins the CIDR lists (allow_cidrs/deny_cidrs) —
    # jansson path notation cannot index arrays dynamically, so the
    # finished strings are the contract.
    $var(allows) = "";
    $var(denies) = "";
    jansson_get("allow_cidrs", $var(gvr), "$var(allows)");
    jansson_get("deny_cidrs", $var(gvr), "$var(denies)");
    $sht(ipallow=>allowlist) = $var(allows);
    $sht(ipallow=>denylist) = $var(denies);
    $sht(ipallow=>ver) = $var(newver);
    xlog("L_INFO", "ipallow sync: version=$var(newver) allows=$var(allows) denies=$var(denies)
");
}

# Ask gv-core for a rating lock on this call: account + destination.
# 403 is returned when the balance cannot cover the estimate —
# that is the "real-time billing, forced release" guarantee.
# The 200 answer carries {"record":true|false}: when true we engage
# rtpengine call recording (pcap+metadata in the recording volume).
route[BILL_LOCK] {
    $var(body) = '{"call_id": "' + $ci + '", "from_user": "' + $fU + '", "to_user": "' + $rU + '"}';
    $var(rc) = http_connect("gvcore", "/v1/call/start", "application/json", $var(body), "$var(gvr)");
    if ($var(rc) == 200) {
        xlog("L_INFO", "bill-lock ok for $ci\n");
        if ($var(gvr) =~ "\"record\":true") {
            # Recording requested for this call.
            if (start_recording()) {
                xlog("L_INFO", "recording ON for $ci\n");
            } else {
                xlog("L_WARN", "recording FAILED to engage for $ci\n");
            }
        }
    } else {
        xlog("L_WARN", "bill-lock REJECTED for $ci rc=$var(rc)\n");
        sl_send_reply("403", "Insufficient Balance");
        exit;
    }
}

# Gateway selection from the NATS-mirrored gw htable: pick the
# highest-priority (lowest prio value) enabled gateway, skipping any
# in the gwfail cooldown window. Records the choice on meta:gw:<ci>
# (failover exclusion + ACK/BYE relay without a Route header). Empty
# table = 503 (nothing routable).
route[GW_DISPATCH] {
    $sht(meta=>gw:$ci) = $null;
    $var(best) = "";
    $var(bestprio) = 2147483647;
    sht_iterator_start("gwit", "gw");
    while (sht_iterator_next("gwit")) {
        $var(k) = $shtitkey(gwit);
        if ($var(k) =~ "^dest:") {
            $var(id) = $(var(k){s.substr,5,100});
            if ($sht(gw=>en:$var(id)) != $null && $sht(gwfail=>fail:$var(id)) == $null) {
                $var(p) = $sht(gw=>prio:$var(id));
                if ($var(p) == $null || $var(p) == "") {
                    $var(p) = 0;
                }
                if ($var(p) < $var(bestprio)) {
                    $var(bestprio) = $var(p);
                    $var(best) = $var(id);
                }
            }
        }
    }
    sht_iterator_end("gwit");
    if ($var(best) == "") {
        xlog("L_ERR", "no routable gateway for $ci (empty or all cooling down)\n");
        sl_send_reply("503", "No Gateway");
        exit;
    }
    $sht(meta=>gw:$ci) = $var(best);
    $du = $sht(gw=>dest:$var(best));
    xlog("L_INFO", "dispatching $ci to gw $var(best) $du\n");
}

# Gateway failure handling: the transaction failed on the chosen
# gateway — lock it out for 5 minutes (gwfail autoexpire) and retry
# the next-best gateway once. The lockout heals by autoexpire (cheap
# retry) or by an operator disabling the gateway via the API.
failure_route[GW_FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }
    $var(id) = $sht(meta=>gw:$ci);
    if ($var(id) != $null && $var(id) != "") {
        $sht(gwfail=>fail:$var(id)) = 1;
        xlog("L_WARN", "gateway $var(id) failed for $ci: locked out 5m\n");
    }
    # One failover attempt: re-run selection (skips the locked
    # gateway). A second failure answers upstream via t_relay's own
    # failure propagation.
    route(GW_DISPATCH);
    if (!t_relay()) {
        t_reply("503", "No Gateway");
    }
}

# In-dialog ACK/BE without a Route header: relay to the gateway the
# INVITE selected (meta:gw), falling back to a re-selection when the
# call state is gone (very late BYE after a restart).
route[GW_CONTACT] {
    $var(id) = $sht(meta=>gw:$ci);
    if ($var(id) != $null && $var(id) != "" && $sht(gw=>dest:$var(id)) != $null) {
        $du = $sht(gw=>dest:$var(id));
        return;
    }
    route(GW_DISPATCH);
}

route[CDR_EVENT] {
    # Compose the end event with measured metadata:
    #   duration = BYE time - answer time (both htable-marked)
    #   pdd_ms   = first 200 - INVITE arrival
    #   sip_code = 200 on the normal BYE path
    $var(dur) = 0;
    if ($sht(meta=>an:$ci) > 0) {
        $var(dur) = $TS - $sht(meta=>an:$ci);
    }
    $var(pdd) = 0;
    if ($sht(meta=>st:$ci) > 0 && $sht(meta=>an:$ci) > 0) {
        # Microsecond-precision PDD: (an - st) whole seconds plus the
        # usec delta, rounded to milliseconds.
        $var(secs) = $sht(meta=>an:$ci) - $sht(meta=>st:$ci);
        $var(usdiff) = $sht(meta=>anus:$ci) - $sht(meta=>stus:$ci);
        $var(pdd) = $var(secs) * 1000 + ($var(usdiff) / 1000);
    }
    $var(body) = '{"call_id": "' + $ci + '", "event": "end", "duration": ' + $var(dur) + ', "pdd_ms": ' + $var(pdd) + ', "sip_code": 200, "release": "normal"}';
    #!ifdef WITH_NATS_CDR
    # Bus transport: async publish; the CDRR worker in gv-core owns
    # finalization + persistence (at-least-once, uq_cdr_call dedup).
    nats_publish("gvos.cdr.raw", $var(body));
    #!else
    $var(rc) = http_connect("gvcore", "/v1/call/end", "application/json", $var(body), "$var(gvr)");
    if ($var(rc) != 200) {
        xlog("L_ERR", "cdr event failed for $ci rc=$var(rc)\n");
    }
    #!endif
    $sht(meta=>an:$ci) = $null;
    $sht(meta=>st:$ci) = $null;
    $sht(meta=>anus:$ci) = $null;
    $sht(meta=>stus:$ci) = $null;
}

# Registration event publish: gv-core mirrors the network-wide
# registration state and feeds reg_freq fraud rules from this feed.
route[REG_EVENT] {
    #!ifdef WITH_NATS
    # The granted expiry (registrar clamps it to max_expires): use
    # the Expires header value directly; default 0 when absent.
    $var(exp) = 0;
    if ($hdr(Expires) != $null) {
        $var(exp) = $hdr(Expires);
    }
    $var(body) = '{"user": "' + $fU + '", "op": "reg", "expires": ' + $var(exp) + ', "src_ip": "' + $si + '"}';
    nats_publish("gvos.reg.event", $var(body));
    #!else
    xlog("L_INFO", "reg event $fU (no nats transport)
");
    #!endif
}

# Answer/200 handling: notify gv-core that the call connected. Uses
# $rs (reply status) and @CSeq.method for the method on replies (the
# $rm PV on the reply path reflects the reply's transaction method,
# which is what we want). Records answer time for the duration
# measurement.
onreply_route {
    if ($rs == "200" && $rm == "INVITE") {
        $sht(meta=>an:$ci) = $TV(s);
        $sht(meta=>anus:$ci) = $TV(u);
        $var(body) = '{"call_id": "' + $ci + '", "event": "answer"}';
        $var(rc) = http_connect("gvcore", "/v1/call/answer", "application/json", $var(body), "$var(gvr)");
        if ($var(rc) != 200) {
            xlog("L_ERR", "answer event failed for $ci rc=$var(rc)\n");
        }
    }
}

# WebSocket upgrade: browsers hit the TLS listener with an HTTP GET
# upgrade request; xhttp routes it here and websocket answers.
event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET") {
        if (!ws_handle_handshake()) {
            xhttp_reply("500", "Internal Server Error", "", "");
        }
        return;
    }
    xhttp_reply("404", "Not Found", "", "");
}

# ---- NATS event routes ----

# Config reload broadcast: gv-core is the authority; payloads are
# full-array and idempotent (safe to apply any number of times —
# gv-core re-broadcasts every 60s as the reconciliation heartbeat).
#!ifdef WITH_NATS
event_route[nats:gvos-edge-cfg] {
    $var(entity) = "";
    jansson_get("entity", $natsData, "$var(entity)");
    if ($var(entity) == "gateway") {
        route(GW_SYNC);
    } else if ($var(entity) == "ip_allowlist") {
        route(IPALLOW_APPLY);
    } else if ($var(entity) == "blocklist") {
        route(BL_APPLY);
    }
    # Other entities (rate/account/credit/recording/risk/package) are
    # control-plane-internal: gv-core replicas apply them, not us.
}
#!endif

# Gateway snapshot apply: rebuild the gw htable from the full array
# (wipe dest: keys first — stale entries for removed gateways must
# go — then re-insert).
#!ifdef WITH_NATS
route[GW_SYNC] {
    sht_iterator_start("wipe", "gw");
    while (sht_iterator_next("wipe")) {
        $var(k) = $shtitkey(wipe);
        if ($var(k) =~ "^dest:") {
            $sht(gw=>$var(k)) = $null;
        }
    }
    sht_iterator_end("wipe");
    $var(cnt) = 0;
    jansson_array_size("gateways", $natsData, "$var(cnt)");
    $var(n) = 0;
    while ($var(n) < $var(cnt)) {
        $var(id) = "";
        $var(addr) = "";
        $var(prio) = 0;
        $var(en) = "0";
        $var(path) = "gateways[" + $var(n) + "]";
        jansson_get("$var(path).id", $natsData, "$var(id)");
        jansson_get("$var(path).sip_addr", $natsData, "$var(addr)");
        jansson_get("$var(path).priority", $natsData, "$var(prio)");
        jansson_get("$var(path).enabled", $natsData, "$var(en)");
        if ($var(id) != "" && $var(id) != $null && $var(addr) != "" && $var(addr) != $null) {
            $sht(gw=>dest:$var(id)) = "sip:" + $var(addr);
            $sht(gw=>prio:$var(id)) = $var(prio);
            if ($var(en) == "1" || $var(en) == "true") {
                $sht(gw=>en:$var(id)) = 1;
            }
        }
        $var(n) = $var(n) + 1;
    }
    xlog("L_INFO", "GW_SYNC applied $var(n) gateways via NATS\n");
}
#!endif

# IP allowlist apply from the broadcast (same rules-array shape as
# the snapshot endpoint). The 30s poll remains as reconciliation.
#!ifdef WITH_NATS
route[IPALLOW_APPLY] {
    # gv-core pre-joins the CIDR lists in the broadcast payload (same
    # contract as the snapshot endpoint) — dynamic jansson array
    # indexing is not supported, so the strings are the contract.
    $var(allows) = "";
    $var(denies) = "";
    jansson_get("allow_cidrs", $natsData, "$var(allows)");
    jansson_get("deny_cidrs", $natsData, "$var(denies)");
    $sht(ipallow=>allowlist) = $var(allows);
    $sht(ipallow=>denylist) = $var(denies);
    $sht(ipallow=>ver) = "nats";
    xlog("L_INFO", "ipallow applied via NATS allows=$var(allows) denies=$var(denies)
");
}
#!endif

# Blocklist apply (per-op broadcasts + the 60s full replay): add or
# remove black dest prefixes in the bl mirror. White/regex rules stay
# in gv-core — the edge screens prefixes only.
#!ifdef WITH_NATS
route[BL_APPLY] {
    $var(op) = "";
    jansson_get("op", $natsData, "$var(op)");
    $var(kind) = "";
    $var(scope) = "";
    $var(pattern) = "";
    jansson_get("entry.kind", $natsData, "$var(kind)");
    jansson_get("entry.scope", $natsData, "$var(scope)");
    jansson_get("entry.pattern", $natsData, "$var(pattern)");
    if ($var(kind) != "black" || $var(scope) != "dest") {
        return;
    }
    if ($var(pattern) == "" || $var(pattern) == $null) {
        return;
    }
    if ($var(op) == "remove") {
        if ($sht(bl=>bl:dest:$var(pattern)) != $null) {
            $sht(bl=>bl:dest:$var(pattern)) = $null;
            $sht(bl=>count) = $sht(bl=>count) - 1;
        }
    } else {
        if ($sht(bl=>bl:dest:$var(pattern)) == $null) {
            $sht(bl=>bl:dest:$var(pattern)) = 1;
            if ($sht(bl=>count) == $null) {
                $sht(bl=>count) = 0;
            }
            $sht(bl=>count) = $sht(bl=>count) + 1;
        }
    }
    xlog("L_INFO", "bl applied $var(op) dest prefix $var(pattern) via NATS\n");
}
#!endif

# Risk alert: ban the username at the SIP edge (banned htable, 1h
# autoexpire; the admin plane lifts it by adjusting the rule set —
# a re-broadcast re-arms nothing here, entries simply age out).
#!ifdef WITH_NATS
event_route[nats:gvos-edge-risk] {
    $var(user) = "";
    jansson_get("username", $natsData, "$var(user)");
    if ($var(user) == "" || $var(user) == $null) {
        # Payload without username (account id only): the edge keys on
        # $fU and cannot map an account id — skip with a log.
        xlog("L_WARN", "risk alert without username: ignored at edge\n");
        return;
    }
    $sht(banned=>acc:$var(user)) = 1;
    xlog("L_WARN", "RISK ban user $var(user) at SIP edge (1h)\n");
}
#!endif

# Forced teardown (balance exhausted): every node receives the
# broadcast; the node holding the dialog terminates it via the
# dialog module's RPC, the rest no-op. The gv-core TEARDOWN durable
# consumer retries while any node is down; this route is the
# bus-side executor.
#!ifdef WITH_NATS
event_route[nats:gvos-edge-tear] {
    $var(cid) = "";
    jansson_get("call_id", $natsData, "$var(cid)");
    if ($var(cid) == "" || $var(cid) == $null) {
        return;
    }
    # Terminate by call-id: the RPC errors when this node does not
    # hold the dialog (expected no-op for the others in the broadcast
    # fan-out); a success xlog confirms the holder side.
    $var(rpcbody) = '{"jsonrpc":"2.0","method":"dlg.terminate_dlg","params":{"callid":"' + $var(cid) + '"},"id":1}';
    jsonrpc_exec("$var(rpcbody)");
    if ($(jsonrpl(code){s.int}) == 200) {
        xlog("L_INFO", "TEARDOWN terminated dialog $var(cid) via bus\n");
    }
}
#!endif

# usrloc expiry feed: publish the expire event so the gv-core
# registration mirror marks the user offline. The expired contact is
# exposed via the registrar's $ulc profile "exp" (aor = user@domain;
# the user part feeds the mirror, the domain part is the local realm).
event_route[usrloc:contact-expired] {
    #!ifdef WITH_NATS
    $var(aor) = $ulc(exp=>aor);
    $var(user) = $(var(aor){s.select,0,@});
    $var(body) = '{"user": "' + $var(user) + '", "op": "expire", "expires": 0, "src_ip": ""}';
    nats_publish("gvos.reg.event", $var(body));
    #!else
    xlog("L_INFO", "usrloc contact expired (no nats transport)\n");
    #!endif
}
