{{- /* gv-core Deployment + Service: the billing control plane. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gv-core
  labels:
    app: gv-core
spec:
  replicas: {{ .Values.replicaCount.gvCore }}
  selector:
    matchLabels:
      app: gv-core
  template:
    metadata:
      labels:
        app: gv-core
    spec:
      containers:
        - name: gv-core
          image: "{{ .Values.image.gvCore.repository }}:{{ .Values.image.gvCore.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: GVOS_LISTEN
              value: ":8080"
            {{- if .Values.database.existingSecret }}
            - name: GVOS_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: dsn
            {{- else }}
            - name: GVOS_DB_DSN
              value: {{ .Values.database.dsn | quote }}
            {{- end }}
            {{- if .Values.nats.url }}
            - name: GVOS_NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- end }}
            {{- if .Values.redis.url }}
            - name: GVOS_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.gvCore | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gv-core
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: gv-core
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
