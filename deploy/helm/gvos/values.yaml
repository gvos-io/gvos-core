# Default values for the gvos chart.

replicaCount:
  gvCore: 1      # stateless behind shared PG; scale for capacity
  kamailio: 2    # stateless signaling nodes

image:
  gvCore:
    repository: gvos/gvos-core
    tag: "0.1.0"
  # Self-built images (nats.so); see docs/edge-deps-fork-strategy.md.
  # Do not use ghcr.io/kamailio/kamailio-ci alpine — it lacks nats.so.
  kamailio:
    repository: gvos-kamailio
    tag: "6.0.1-gvos.1"
  rtpengine:
    repository: gvos-rtpengine
    tag: "bookworm-gvos.1"

# Database: production brings an external HA Postgres (Patroni or
# managed). The chart does NOT ship a database by default.
database:
  dsn: ""        # e.g. postgres://user:pass@patroni:5432/gvos
  existingSecret: ""  # k8s secret name holding 'dsn' key

# Event bus: external NATS (JetStream recommended, subjects gvos.>).
# Empty disables publishing. The chart does NOT ship a NATS cluster.
nats:
  url: ""        # e.g. nats://nats-client.gvos.svc:4222

# Runtime-state authority (balances/admission/risk windows). External
# by default — the same SLA philosophy as the database. Empty = off
# (single-replica memory authority).
redis:
  url: ""        # e.g. redis://redis.gvos.svc:6379

api:
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    host: gvos.example.com
    tls: false

sip:
  service:
    type: LoadBalancer   # UDP+TCP 5060
  ws:
    enabled: true
    port: 4444

media:
  rtpengine:
    enabled: true
    host: ""             # external rtpengine host+ng port when set

kamailio:
  cfgConfigMap: ""       # override configmap name for kamailio.cfg

resources:
  gvCore:
    requests: { cpu: 500m, memory: 512Mi }
  kamailio:
    requests: { cpu: 250m, memory: 256Mi }
