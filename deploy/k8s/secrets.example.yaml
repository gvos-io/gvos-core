# Example Secret material for the k8s manifests.
# DO NOT commit real values. Apply with:
#   kubectl -n gvos create secret generic gvos-secrets \
#     --from-literal=db-user=gvos \
#     --from-literal=db-password='REPLACE_ME' \
#     --from-literal=db-name=gvos \
#     --from-literal=db-dsn='postgres://gvos:REPLACE_ME@postgres:5432/gvos?sslmode=disable' \
#     --from-literal=internal-token='REPLACE_ME' \
#     --from-literal=grafana-admin-password='REPLACE_ME'
#
# NATS auth (referenced by 02-redis-nats / 03-gv-core / 05-kamailio):
#   kubectl -n gvos create secret generic nats-auth \
#     --from-literal=user=gvos \
#     --from-literal=password='REPLACE_ME'
apiVersion: v1
kind: Secret
metadata:
  name: gvos-secrets
  namespace: gvos
type: Opaque
stringData:
  db-user: gvos
  db-password: REPLACE_ME
  db-name: gvos
  db-dsn: postgres://gvos:REPLACE_ME@postgres:5432/gvos?sslmode=disable
  internal-token: REPLACE_ME
  grafana-admin-password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: nats-auth
  namespace: gvos
type: Opaque
stringData:
  user: gvos
  password: REPLACE_ME
