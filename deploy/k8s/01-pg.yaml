apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gvos
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: gvos-secrets, key: db-user}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: gvos-secrets, key: db-password}}
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: gvos-secrets, key: db-name}}
        ports: [{containerPort: 5432}]
        volumeMounts:
        - {name: pgdata, mountPath: /var/lib/postgresql/data}
        - {name: migrations, mountPath: /docker-entrypoint-initdb.d}
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "gvos"]}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
      volumes:
      - name: migrations
        configMap: {name: pg-migrations}
  volumeClaimTemplates:
  - metadata: {name: pgdata}
    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gvos
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
