# Kamailio edge: the node sysctl fix (net.core.rmem_default=4MB measured
# on the bench — 416KB dropped 401s at 200CPS) rides a PRIVILEGED
# initContainer because rmem_* are non-namespaced sysctls. The kamailio
# cfg is a ConfigMap; the entrypoint (env + sed of @NODE@/@NATS_URL@)
# is also config-managed so fixes ship without image rebuilds.
apiVersion: v1
kind: ConfigMap
metadata: {name: kamailio-entrypoint, namespace: gvos}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    NODE="${GVOS_NODE_HOST:-kamailio-$(hostname)}"
    NODE_SAFE=$(printf '%s' "$NODE" | tr -c 'a-zA-Z0-9.-' '-')
    # The nats module's nats_url takes ONE server string: strip the
    # scheme and take the FIRST host of a comma list (the compose
    # entrypoint does the same; a raw "nats://host" used to end up in
    # libnats as an unresolvable host here).
    NATS_HOST=$(printf '%s' "${GVOS_NATS_URL}" | cut -d, -f1 | sed -E 's|^[a-zA-Z0-9+.-]+://||; s|^[^@]*@||')
    sed -e "s/@NODE@/$NODE_SAFE/g" -e "s|@NATS_URL@|$NATS_HOST|" /etc/kamailio/kamailio.cfg > /tmp/kamailio-run.cfg
    exec kamailio -f /tmp/kamailio-run.cfg -DD -E
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kamailio, namespace: gvos}
spec:
  replicas: 1
  selector: {matchLabels: {app: kamailio}}
  template:
    metadata: {labels: {app: kamailio}}
    spec:
      containers:
      - name: kamailio
        image: gvos-kamailio:6.1.5-gvos.1
        imagePullPolicy: IfNotPresent
        env:
        - {name: GVOS_NODE_HOST, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - name: GVOS_NATS_URL
          value: "nats://$(NATS_USER):$(NATS_PASSWORD)@nats-client.gvos.svc.cluster.local:4222"
        - name: NATS_USER
          valueFrom: {secretKeyRef: {name: nats-auth, key: user, optional: true}}
        - name: NATS_PASSWORD
          valueFrom: {secretKeyRef: {name: nats-auth, key: password, optional: true}}
        - {name: WITH_NATS, value: "1"}
        - {name: WITH_NATS_CDR, value: "1"}
        - {name: WITH_NATS_RPC, value: "1"}
        # HTTP poller targets (ipallow/gateway/did snapshots): without
        # GVOS_CORE_HOST the entrypoint renders "http://:8080/..." and
        # the pollers fail-loop rc=3 every 30s (observed on the live
        # dev stack 2026-11-25). NATS broadcast masks it, but the
        # reconciliation path must also work.
        - {name: GVOS_CORE_HOST, value: "gv-core"}
        - name: GVOS_INTERNAL_TOKEN
          valueFrom: {secretKeyRef: {name: gvos-secrets, key: internal-token, optional: true}}
        ports:
        - {containerPort: 5060, protocol: UDP}
        - {containerPort: 5060, protocol: TCP}
        readinessProbe:
          # TCP socket probe (NOT kamcmd): the ctl socket races with
          # kamailio startup, and every probe failure triggers a
          # SIGTERM whose nats-module teardown path segfaults
          # (q_malloc BUG, K8s-only because compose never restarts
          # the edge under probes).
          tcpSocket: {port: 5060}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {memory: 512Mi}}
        volumeMounts:
        - {name: cfg, mountPath: /etc/kamailio/kamailio.cfg, subPath: kamailio.cfg}
        - {name: entrypoint, mountPath: /usr/local/bin/entrypoint.sh, subPath: entrypoint.sh}
        - {name: tls, mountPath: /etc/kamailio/tls}
      volumes:
      - name: cfg
        configMap: {name: kamailio-cfg}
      - name: entrypoint
        configMap: {name: kamailio-entrypoint}
      - name: tls
        secret: {secretName: kamailio-tls-secret}
---
apiVersion: v1
kind: Service
metadata: {name: kamailio, namespace: gvos}
spec:
  selector: {app: kamailio}
  ports:
  - {name: udp, port: 5060, protocol: UDP, targetPort: 5060}
  - {name: tcp, port: 5060, protocol: TCP, targetPort: 5060}
