apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gvos
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports: [{containerPort: 6379}]
        resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: gvos}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
# NATS 3-node R3 cluster. StatefulSet pods are nats-0/1/2 with DNS
# nats-N.nats.gvos.svc.cluster.local; the client URL uses the headless
# name. The plain ClusterIP service "nats" is for clients that seed a
# single address (kamailio's nats_url).
apiVersion: v1
kind: Service
metadata: {name: nats, namespace: gvos}
spec:
  clusterIP: None
  selector: {app: nats}
  ports:
  - {name: client, port: 4222}
  - {name: cluster, port: 6222}
  - {name: monitor, port: 8222}
---
apiVersion: v1
kind: Service
metadata: {name: nats-client, namespace: gvos}
spec:
  selector: {app: nats}
  ports: [{port: 4222, targetPort: 4222}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: nats, namespace: gvos}
spec:
  serviceName: nats
  replicas: 3
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      containers:
      - name: nats
        image: nats:2-alpine
        command: ["nats-server"]
        args:
        - -js
        - -m
        - "8222"
        - --cluster_name
        - gvos
        - -n
        - $(POD_NAME)
        - --cluster
        - nats://0.0.0.0:6222
        - --routes
        - nats://nats-0.nats.gvos.svc.cluster.local:6222,nats://nats-1.nats.gvos.svc.cluster.local:6222,nats://nats-2.nats.gvos.svc.cluster.local:6222
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        ports:
        - {containerPort: 4222, name: client}
        - {containerPort: 6222, name: cluster}
        - {containerPort: 8222, name: monitor}
        resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: nats-monitor, namespace: gvos}
spec:
  selector: {app: nats}
  ports: [{port: 8222}]
