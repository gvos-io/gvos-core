apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: gvos}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        imagePullPolicy: IfNotPresent
        args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
        ports: [{containerPort: 9090}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: gvos}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: gvos}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: gvos-secrets, key: grafana-admin-password}}
        ports: [{containerPort: 3000}]
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: gvos}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, nodePort: 31234}]
