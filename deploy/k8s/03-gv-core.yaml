apiVersion: apps/v1
kind: Deployment
metadata: {name: gv-core, namespace: gvos}
spec:
  replicas: 1   # call state is in-memory (m.calls) — scale out needs the
                # Phase D queue-group/sticky work item; documented choice ③
  selector: {matchLabels: {app: gv-core}}
  template:
    metadata: {labels: {app: gv-core}}
    spec:
      containers:
      - name: gv-core
        image: gvos-gv-core:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: GVOS_DB_DSN, value: "postgres://gvos:gvos_dev@postgres:5432/gvos?sslmode=disable"}
        - {name: GVOS_NATS_URL, value: "nats://nats-0.nats.gvos.svc.cluster.local:4222,nats://nats-1.nats.gvos.svc.cluster.local:4222,nats://nats-2.nats.gvos.svc.cluster.local:4222"}
        - {name: GVOS_NATS_STREAM_REPLICAS, value: "3"}
        - {name: GVOS_ZOMBIE_TIMEOUT, value: "90s"}
        - {name: GVOS_INTERNAL_TOKEN, value: "dev-internal-token"}
        - {name: GVOS_REDIS_URL, value: "redis://redis:6379"}
        - {name: GVOS_INTERNAL_TOKEN, value: "dev-internal-token"}
        ports: [{containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources: {requests: {cpu: 250m, memory: 64Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gv-core, namespace: gvos}
spec:
  selector: {app: gv-core}
  ports: [{port: 8080, targetPort: 8080}]
