# G-VOS one-command deployment (spike stage).
# Brings up: gv-core (billing control plane), Kamailio (signaling),
# RTPengine (media), a demo SIP gateway, and PostgreSQL.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then run the SIPp scenario against kamailio:5060:
#   docker run --rm --network gvos_default ghcr.io/sipp/sipp:latest \
#     -sf /scenarios/basic_call.xml -s 1000 kamailio   (see test/sipp/)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gvos
      POSTGRES_PASSWORD: gvos_dev
      POSTGRES_DB: gvos
    volumes:
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvos"]
      interval: 5s
      timeout: 3s
      retries: 10

  gv-core:
    build:
      context: ..
      dockerfile: deploy/gv-core.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GVOS_DB_DSN: "postgres://gvos:gvos_dev@postgres:5432/gvos?sslmode=disable"
      GVOS_LISTEN: ":8080"
    ports:
      - "8080:8080"

  kamailio:
    # Official CI build (ghcr mirror works where docker.io is blocked).
    image: ghcr.io/kamailio/kamailio-ci:6.1-alpine
    depends_on:
      - gv-core
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"

  rtpengine:
    # Media relay; disabled for signaling-only tests (comment out in
    # kamailio.cfg RTP_RELAY when unused). Kept as a profile service.
    image: ghcr.io/kamailio/kamailio-ci:6.1-alpine
    command: ["sleep", "infinity"]
    profiles: ["full-media"]

  demo-gw:
    # SIPp UAS: answers INVITEs with 200. ctaloi/sipp is pinned locally.
    image: ctaloi/sipp:latest
    entrypoint: ["sipp", "-sn", "uas", "-p", "5060"]
    restart: unless-stopped

volumes:
  pgdata:
