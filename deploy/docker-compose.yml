# G-VOS one-command deployment (spike stage).
# Brings up: gv-core (billing control plane), Kamailio (signaling),
# RTPengine (media), a demo SIP gateway, PostgreSQL, and NATS (event
# bus: gvos.> subjects, JetStream enabled).
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then run the SIPp scenario against kamailio:5060:
#   docker run --rm --network gvos_default ghcr.io/sipp/sipp:latest \
#     -sf /scenarios/basic_call.xml -s 1000 kamailio   (see test/sipp/)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gvos
      POSTGRES_PASSWORD: gvos_dev
      POSTGRES_DB: gvos
    volumes:
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvos"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    # Event bus (JetStream): CDR stream, teardown/risk alerts, admin
    # change feed — see internal/events for the subject scheme.
    # gv-core does NOT gate on NATS health: it tolerates the broker
    # being down (RetryOnFailedConnect) and starts before NATS.
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "14222:4222"
      - "18222:8222" # monitoring endpoint

  redis:
    # Runtime-state authority (balances/admission/risk windows).
    # Ephemeral on purpose in the demo: persistence is PG's job;
    # a redis restart just re-seeds from the hour rollback.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gv-core:
    build:
      context: ..
      dockerfile: deploy/gv-core.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      GVOS_DB_DSN: "postgres://gvos:gvos_dev@postgres:5432/gvos?sslmode=disable"
      GVOS_NATS_URL: "nats://nats:4222"
      GVOS_REDIS_URL: "redis://redis:6379"
      GVOS_INTERNAL_TOKEN: "${GVOS_INTERNAL_TOKEN:-dev-internal-token}"
      GVOS_LISTEN: ":8080"
    volumes:
      - ./tls:/etc/gvos/tls:ro
    ports:
      - "28080:8080"

  kamailio:
    # Self-built image: the upstream CI alpine build lacks nats.so
    # (see kamailio.Dockerfile). Debian bookworm ships
    # kamailio-nats-modules (Kamailio 5.6).
    build:
      context: .
      dockerfile: kamailio.Dockerfile
    image: gvos-kamailio
    depends_on:
      gv-core:
        condition: service_started
      nats:
        condition: service_started
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./tls:/etc/kamailio/tls:ro
    environment:
      GVOS_CORE_HOST: gv-core
      GVOS_INTERNAL_TOKEN: "${GVOS_INTERNAL_TOKEN:-dev-internal-token}"
      # Per-node identity: builds the unique NATS queue group name
      # (broadcast semantics across the signaling pool).
      GVOS_NODE_HOST: kamailio-1
      # NATS publish routes on: registration events + CDR over bus.
      WITH_NATS: "1"
      WITH_NATS_CDR: "1"
    ports:
      - "15060:5060/udp"
      - "15060:5060/tcp"
      - "14444:4444/tcp"

  rtpengine:
    # Media relay built from Debian packages (see rtpengine.Dockerfile);
    # userspace forwarding (no kernel module in-container).
    build:
      context: .
      dockerfile: rtpengine.Dockerfile
    image: gvos-rtpengine
    restart: unless-stopped
    volumes:
      - recdata:/recording

  # Transcoding daemon (R1, recording-oss-upgrade-plan): consumes the
  # rtpengine DUX spool and emits MP3 per SSRC. Opt-in via
  # `--profile recording` — the spool consumer format issue recorded in
  # the plan §R0 makes this experimental until the verification batch.
  recording:
    build:
      context: .
      dockerfile: recording.Dockerfile
    image: gvos-recording
    profiles: ["recording"]
    depends_on: [rtpengine]
    volumes:
      - recdata:/recording:ro
      - recout:/output

  demo-gw:
    # SIPp UAS: answers INVITEs with 200. ctaloi/sipp is pinned locally.
    image: ctaloi/sipp:latest
    entrypoint: ["sipp", "-sn", "uas", "-p", "5060"]
    restart: unless-stopped

volumes:
  pgdata:
  recout:
  recdata:
