# G-VOS scrape config: gv-core's /metrics is the platform face; add
# node/kamailio exporters here when they are deployed.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: gvos-core
    static_configs:
      - targets: ["gv-core:8080"]
