# Bare-Kamailio baseline: the SAME auth flow as gvos's edge (401
# challenge + HA1 verify, same SIPp load.xml scenario), then plain
# stateful forwarding to the gateway. No RPC, no billing, no dialog
# module, no rtpengine — this is what "直接用 Kamailio" means for an
# apples-to-apples capacity comparison on the SAME host and bridge.
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "auth.so"
loadmodule "siputils.so"
loadmodule "textops.so"

children=32

route {
    if (has_totag()) {
        loose_route();
        t_relay();
        exit;
    }
    if (is_method("INVITE")) {
        if (!pv_www_authenticate("demo", "07548ffb00f20c09c72b51c2085f8eef", "1")) {
            www_challenge("demo", "0");
            exit;
        }
        record_route();
        $du = "sip:demo-gw:5060";
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }
    if (is_method("ACK")) {
        t_relay();
        exit;
    }
    sl_send_reply("403", "Forbidden");
    exit;
}
